        // ========== HEATMAP LOGIC WITH BUTTON INDICATOR ==========
        const heatmapPanel = document.getElementById('heatmap-panel');
        const heatmapToggleBtn = document.getElementById('heatmap-toggle-btn');
        let heatmapOn = false;

        // Fetch nodes within radius (used for button indicator and panel)
        async function fetchNodesWithinRadius(centerLat, centerLng, radiusKm) {
            const delta = radiusKm / 111;
            const latMin = centerLat - delta;
            const latMax = centerLat + delta;
            const lngMin = centerLng - delta / Math.cos(centerLat * Math.PI / 180);
            const lngMax = centerLng + delta / Math.cos(centerLat * Math.PI / 180);
            const { data, error } = await _supabase
                .from('nodes')
                .select('id, lat, lng')
                .eq('status', 'active')
                .gt('expires_at', new Date().toISOString())
                .gte('lat', latMin)
                .lte('lat', latMax)
                .gte('lng', lngMin)
                .lte('lng', lngMax);
            if (error) throw error;
            return (data || []).filter(node => 
                haversine(centerLat, centerLng, node.lat, node.lng) <= radiusKm
            );
        }

        // Update the button's border and shadow to reflect activity level (even when heatmap is OFF)
        async function updateButtonIndicator() {
            if (!gpsReady && myLoc.lat === 0) return;
            let centerLat = myLoc.lat;
            let centerLng = myLoc.lng;
            if (!centerLat || centerLat === 0) {
                const mapCenter = map.getCenter();
                centerLat = mapCenter.lat;
                centerLng = mapCenter.lng;
            }
            try {
                const nodes = await fetchNodesWithinRadius(centerLat, centerLng, HEATMAP_RADIUS_KM);
                const total = nodes.length;
                let borderColor, shadowColor;
                if (total >= 10) {
                    borderColor = '#ff5050';   // red
                    shadowColor = '0 0 12px #ff5050';
                } else if (total >= 3) {
                    borderColor = '#FFD700';   // yellow/gold
                    shadowColor = '0 0 12px #FFD700';
                } else if (total >= 1) {
                    borderColor = '#80ff80';   // light green
                    shadowColor = '0 0 12px #80ff80';
                } else {
                    borderColor = '#FFD700';    // default gold for zero nodes
                    shadowColor = '0 0 10px #FFD700';
                }
                heatmapToggleBtn.style.borderColor = borderColor;
                heatmapToggleBtn.style.boxShadow = shadowColor;
                // Optionally store the total count as a data attribute for debugging
                heatmapToggleBtn.setAttribute('data-node-count', total);
            } catch (err) {
                console.warn('Failed to update button indicator', err);
            }
        }

        // Group nodes for detailed toast
        function groupNodesByGrid(nodes, cellSizeDeg) {
            const grid = new Map();
            nodes.forEach(node => {
                const cellLat = Math.floor(node.lat / cellSizeDeg) * cellSizeDeg;
                const cellLng = Math.floor(node.lng / cellSizeDeg) * cellSizeDeg;
                const key = `${cellLat},${cellLng}`;
                if (!grid.has(key)) {
                    grid.set(key, { count: 0 });
                }
                grid.get(key).count++;
            });
            return Array.from(grid.values());
        }

        function showToast(message, targetElement) {
            const toast = document.createElement('div');
            toast.className = 'heatmap-toast';
            toast.innerText = message;
            document.body.appendChild(toast);
            const rect = targetElement.getBoundingClientRect();
            toast.style.left = rect.right + 10 + 'px';
            toast.style.top = rect.top + (rect.height/2) - 10 + 'px';
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function toggleHeatmap() {
            heatmapOn = !heatmapOn;
            heatmapToggleBtn.style.background = heatmapOn ? '#FFD700' : '#000';
            heatmapToggleBtn.style.color = heatmapOn ? '#000' : '#FFD700';
            if (!heatmapOn) {
                heatmapPanel.style.display = 'none';
                heatmapPanel.innerHTML = '';
                // Still update the button indicator (border) to show current pulse
                updateButtonIndicator();
                return;
            }
            heatmapPanel.style.display = 'flex';
            const loadingDiv = document.getElementById('heatmap-loading');
            loadingDiv.style.display = 'block';
            try {
                let centerLat = myLoc.lat;
                let centerLng = myLoc.lng;
                if (!centerLat || centerLat === 0) {
                    const mapCenter = map.getCenter();
                    centerLat = mapCenter.lat;
                    centerLng = mapCenter.lng;
                    setStatus('warning', 'Using map center (GPS unavailable)');
                }
                const nodes = await fetchNodesWithinRadius(centerLat, centerLng, HEATMAP_RADIUS_KM);
                const totalNodes = nodes.length;
                let intensity, color, label;
                if (totalNodes >= 10) {
                    intensity = 'high';
                    color = 'rgba(255,80,80,0.8)';
                    label = '🔴 HIGH ACTIVITY';
                } else if (totalNodes >= 3) {
                    intensity = 'moderate';
                    color = 'rgba(255,215,0,0.8)';
                    label = '🟡 MODERATE';
                } else if (totalNodes >= 1) {
                    intensity = 'quiet';
                    color = 'rgba(80,255,80,0.8)';
                    label = '🟢 QUIET';
                } else {
                    heatmapPanel.innerHTML = '<div style="color:#aaa;font-size:10px;padding:5px">No active nodes within radius</div>';
                    loadingDiv.style.display = 'none';
                    updateButtonIndicator(); // ensure button still shows pulse (will be zero)
                    return;
                }
                // Build detailed breakdown for toast
                const cells = groupNodesByGrid(nodes, HEATMAP_CELL_SIZE_DEG);
                let details = '';
                if (cells.length === 1) {
                    details = `${cells[0].count} nodes in this area`;
                } else {
                    const highCells = cells.filter(c => c.count >= 10);
                    const modCells = cells.filter(c => c.count >= 3 && c.count < 10);
                    const lowCells = cells.filter(c => c.count < 3);
                    const parts = [];
                    if (highCells.length) parts.push(`${highCells.length} high‑density area(s)`);
                    if (modCells.length) parts.push(`${modCells.length} moderate area(s)`);
                    if (lowCells.length) parts.push(`${lowCells.length} low‑density area(s)`);
                    details = parts.join(', ') + `. ${totalNodes} total nodes.`;
                }
                const summary = `${label} — ${totalNodes} nodes within ${HEATMAP_RADIUS_KM} km. ${details}`;
                heatmapPanel.innerHTML = `
                    <div class="heatmap-circle" data-summary="${summary.replace(/"/g, '&quot;')}">
                        <div class="circle-dot" style="background:${color}; box-shadow:0 0 5px ${color};"></div>
                        <div class="circle-label">${label}</div>
                        <div class="circle-stats">${totalNodes} nodes</div>
                    </div>
                `;
                document.querySelector('.heatmap-circle').addEventListener('click', (e) => {
                    e.stopPropagation();
                    showToast(summary, e.currentTarget);
                });
                setStatus('success', `Heatmap: ${totalNodes} active nodes within ${HEATMAP_RADIUS_KM} km`);
                setTimeout(() => clearStatus(), 3000);
                // Also update the button indicator (though it may already be correct)
                updateButtonIndicator();
            } catch (err) {
                console.error(err);
                setStatus('error', 'Failed to load heatmap data');
                heatmapPanel.innerHTML = '<div style="color:#f00;font-size:10px;padding:5px">Error loading data</div>';
            } finally {
                loadingDiv.style.display = 'none';
            }
        }

        heatmapToggleBtn.addEventListener('click', toggleHeatmap);

        // Update button indicator every 30 seconds and when map moves / GPS updates
        setInterval(updateButtonIndicator, 30000);
        map.on('moveend', updateButtonIndicator);
        // Also update when GPS is acquired
        const gpsWatcher = setInterval(() => {
            if (gpsReady && myLoc.lat !== 0) {
                updateButtonIndicator();
                clearInterval(gpsWatcher);
            }
        }, 1000);
        updateButtonIndicator();
    </script>
</body>
</html>
