        #heatmap-panel{position:absolute;top:115px;left:20px;background:rgba(0,0,0,0.9);border:1px solid #FFD700;border-radius:8px;padding:10px;display:none;flex-direction:column;gap:6px;z-index:2000;min-width:180px;max-width:240px;max-height:250px;overflow-y:auto}

        .accordion-section{border-bottom:1px solid #FFD700}

        .node-type-row{margin:8px 0;display:flex;gap:10px;align-items:center}
        .vibe-row{margin:8px 0}
        .vibe-option{background:transparent;border:1px solid #FFD700;color:#FFD700;padding:5px 10px;cursor:pointer;font-family:monospace;font-size:11px;margin-right:5px}
        .vibe-option.selected{background:#FFD700;color:#000}
        .custom-input{width:100%;padding:8px;background:#000;border:1px solid #FFD700;color:#FFD700;margin-top:5px;font-family:monospace;font-size:12px;display:none}
        .done-btn{display:none;margin-top:8px;background:#FFD700;color:#000;border:none;padding:8px 16px;cursor:pointer;font-family:monospace}
        .close-btn{display:block;width:100%;background:transparent;border:none;border-top:1px solid #f00;color:#f00;padding:12px;text-align:center;font-family:monospace;cursor:pointer}
        .hud-btn{background:transparent;border:1px solid #FFD700;color:#FFD700;padding:12px;margin:10px 5px;cursor:pointer;font-family:monospace;text-transform:uppercase}
        .sync-btn{background:transparent;border:2px solid #FFD700;color:#FFD700;padding:15px 30px;cursor:pointer;font-family:monospace;font-size:16px;margin:10px}
        .rate-btn{background:transparent;border:2px solid #FFD700;color:#FFD700;padding:15px 25px;cursor:pointer;font-family:monospace;font-size:24px;margin:10px}
        .inbox-item{display:flex;align-items:center;margin-bottom:8px;padding:8px;border:1px solid #FFD700}

        .inbox-item .info{flex:1;font-size:12px}

        #receipt-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:9999;justify-content:center;align-items:center;flex-direction:column;color:#FFD700;font-family:monospace}

<body>
    <!-- Same HTML body as before – unchanged -->
    <div id="map"></div>

    <div id="sync-panel">...</div>
    <div id="rate-panel">...</div>
    <div id="nav-hud">...</div>
    <div id="receipt-overlay">...</div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        // Supabase client and all app logic (same as previous working version – not repeated for brevity)
        // ... [the entire script from the previous message, with the heatmap panel modified as below] ...

        // ========== AGGREGATED HEATMAP PANEL WITH TOTAL COUNT ==========
        const heatmapPanel = document.createElement('div');
        heatmapPanel.id = 'heatmap-panel';
        heatmapPanel.style.cssText = 'position:absolute;top:115px;left:20px;background:rgba(0,0,0,0.9);border:1px solid #FFD700;border-radius:8px;padding:10px;display:none;flex-direction:column;gap:6px;z-index:2000;min-width:180px;max-width:240px;max-height:250px;overflow-y:auto';
        document.body.appendChild(heatmapPanel);

        const heatmapToggleBtn = document.getElementById('heatmap-toggle-btn');
        let heatmapOn = false;
        let reverseGeocodeCache = new Map();

        async function getAreaName(lng, lat) { /* same as before */ }
        async function fetchNodesWithinRadius(centerLat, centerLng, radiusKm) { /* same */ }
        function groupNodesByGrid(nodes, cellSizeDeg = 0.02) { /* same */ }

        async function updateHeatmapPanel() {
            if (!heatmapOn) return;
            const loadingDiv = document.getElementById('heatmap-loading');
            if (loadingDiv) loadingDiv.style.display = 'block';
            try {
                let centerLat = myLoc.lat;
                let centerLng = myLoc.lng;
                if (!centerLat || centerLat === 0) {
                    const mapCenter = map.getCenter();
                    centerLat = mapCenter.lat;
                    centerLng = mapCenter.lng;
                }
                const nodes = await fetchNodesWithinRadius(centerLat, centerLng, HEATMAP_RADIUS_KM);
                const totalNodes = nodes.length;
                if (!nodes.length) {
                    heatmapPanel.innerHTML = '<div style="color:#aaa;font-size:11px;padding:5px">No active nodes nearby</div>';
                    return;
                }
                const cells = groupNodesByGrid(nodes, HEATMAP_CELL_SIZE_DEG);
                const eligibleCells = cells.filter(cell => cell.count >= MIN_NODES_FOR_HEATMAP);
                
                let html = `<div class="total-count">📊 TOTAL ACTIVE NODES: ${totalNodes}</div>`;
                if (eligibleCells.length === 0) {
                    html += `<div style="color:#aaa;font-size:11px;padding:5px">No area with ≥${MIN_NODES_FOR_HEATMAP} nodes</div>`;
                } else {
                    for (const cell of eligibleCells) {
                        let dotColor, intensityChar;
                        if (cell.count >= 10) {
                            dotColor = '#ff5050';
                            intensityChar = '🔴';
                        } else if (cell.count >= 3) {
                            dotColor = '#FFD700';
                            intensityChar = '🟡';
                        } else {
                            dotColor = '#80ff80';
                            intensityChar = '🟢';
                        }
                        const areaName = await getAreaName(cell.lng, cell.lat);
                        html += `
                            <div class="heatmap-row" data-name="${areaName.replace(/"/g, '&quot;')}" data-count="${cell.count}" data-intensity="${intensityChar}">
                                <div class="heatmap-dot" style="background:${dotColor}; box-shadow:0 0 4px ${dotColor};"></div>
                                <div class="heatmap-label">${intensityChar} ${areaName}</div>
                                <div class="heatmap-count">${cell.count} node${cell.count !== 1 ? 's' : ''}</div>
                            </div>
                        `;
                    }
                }
                heatmapPanel.innerHTML = html;
                // attach click handlers (skip the total count row)
                document.querySelectorAll('#heatmap-panel .heatmap-row').forEach(el => {
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const name = el.dataset.name;
                        const count = el.dataset.count;
                        const intensity = el.dataset.intensity;
                        const toast = document.createElement('div');
                        toast.className = 'heatmap-toast';
                        toast.innerText = `${intensity} ${count} node${count !== 1 ? 's' : ''} in ${name}`;
                        document.body.appendChild(toast);
                        const rect = el.getBoundingClientRect();
                        toast.style.left = rect.right + 10 + 'px';
                        toast.style.top = rect.top + (rect.height/2) - 10 + 'px';
                        setTimeout(() => toast.remove(), 3000);
                    });
                });
            } catch (err) {
                console.error(err);
                heatmapPanel.innerHTML = '<div style="color:#f00;font-size:11px;padding:5px">Error loading data</div>';
            } finally {
                if (loadingDiv) loadingDiv.style.display = 'none';
            }
        }

        async function toggleHeatmap() { /* same as before */ }
        heatmapToggleBtn.addEventListener('click', toggleHeatmap);
        map.on('moveend', () => {
            if (heatmapOn) updateHeatmapPanel();
        });
    </script>
</body>
