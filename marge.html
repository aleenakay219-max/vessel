        async function runOracleBrain(s) {

            for (const q of queries) { for (const r of [3, 6, 10, 15, MAX_VENUE_DISTANCE_KM]) { if (bestVenue) break;
                const box = bbox(midLat, midLng, r);
                const url = 'https://api.mapbox.com/search/geocode/v6/forward?q=' + encodeURIComponent(q) + '&proximity=' + midLng + ',' + midLat + '&bbox=' + box + '&limit=10&access_token=' + MAPBOX_TOKEN;

                } catch (e) { } }
                if (bestVenue) break;

        }

                    currentN = { id: nodeProps.id, intent: nodeProps.intent, category: nodeProps.category, node_type: nodeProps.node_type };
                    document.getElementById('terminal').style.display = 'flex';
                    document.getElementById('oracle-btn').style.display = 'block';
                    startChatSync();
                    startOracleLive();
                } else if (data.status === 'declined') {
                    clearInterval(acceptancePoll);
                    acceptancePoll = null;
                    setStatus('error','Creator declined');
                    currentN = null;
                }
            }, 2000);
        }

        // ========== NODE SCANNING (unchanged) ==========
        map.on('load', () => {
            map.addSource('nodes-source', {
                type: 'geojson',
                data: { type: 'FeatureCollection', features: [] },
                cluster: true, clusterMaxZoom: 14, clusterRadius: 50
            });
            map.addLayer({ id:'nodes-clusters', type:'circle', source:'nodes-source', filter:['has','point_count'],
                paint:{ 'circle-color':'#111','circle-stroke-color':'#FFD700','circle-stroke-width':2,
                    'circle-radius':['step',['get','point_count'],20,10,25,30,35],'circle-opacity':0.9 } });
            map.addLayer({ id:'nodes-cluster-count', type:'symbol', source:'nodes-source', filter:['has','point_count'],
                layout:{ 'text-field':'{point_count_abbreviated}','text-font':['DIN Offc Pro Medium','Arial Unicode MS Bold'],'text-size':14 },
                paint:{ 'text-color':'#FFD700' } });
            map.addLayer({ id:'nodes-unclustered', type:'circle', source:'nodes-source', filter:['!',['has','point_count']],
                paint:{ 'circle-color':['get','color'],'circle-radius':8,'circle-opacity':0.9,'circle-stroke-color':'#fff','circle-stroke-width':1.5 } });
            map.addLayer({ id:'nodes-emoji', type:'symbol', source:'nodes-source', filter:['!',['has','point_count']],
                layout:{ 'text-field':['get','emoji'], 'text-font':['Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Arial Unicode MS Bold'], 'text-size':16, 'text-allow-overlap':true },
                paint:{ 'text-color':'#fff', 'text-halo-color':'#000', 'text-halo-width':1 } });
            const popup = new mapboxgl.Popup({ closeButton:false, closeOnClick:false, className:'node-popup' });
            map.on('mouseenter', 'nodes-unclustered', (e) => {
                map.getCanvas().style.cursor = 'pointer';
                const props = e.features[0].properties;
                const timeLeft = Math.max(0, Math.floor((new Date(props.expires_at) - Date.now()) / 60000));
                popup.setLngLat(e.lngLat).setHTML(props.intent + ' [' + timeLeft + 'm]').addTo(map);
            });
            map.on('mouseleave', 'nodes-unclustered', () => { map.getCanvas().style.cursor = ''; popup.remove(); });
            map.on('click', 'nodes-unclustered', async (e) => {
                if (currentMode !== 'browse') return;
                if (currentN) return;
                const nodeProps = e.features[0].properties;
                openProfileCard(nodeProps);
            });
            map.on('click', 'nodes-clusters', (e) => {
                const features = map.queryRenderedFeatures(e.point, { layers:['nodes-clusters'] });
                const clusterId = features[0].properties.cluster_id;
                map.getSource('nodes-source').getClusterExpansionZoom(clusterId, (err, zoom) => { if (!err) map.easeTo({ center:features[0].geometry.coordinates, zoom }); });
            });
            scan();
            map.on('moveend', scan);
        });
        async function scan(){
            const now = new Date().toISOString();
            const bounds = map.getBounds();
            if (!bounds) return;
            const sw = bounds.getSouthWest(), ne = bounds.getNorthEast();
            const latMin = sw.lat - 0.02, latMax = ne.lat + 0.02;
            const lngMin = sw.lng - 0.02, lngMax = ne.lng + 0.02;
            const { data, error } = await _supabase.from('nodes')
                .select('*').eq('status','active').gt('expires_at', now)
                .gte('lat', latMin).lte('lat', latMax)
                .gte('lng', lngMin).lte('lng', lngMax).limit(200);
            if (error) { setStatus('error','Connection issue'); return; }
            const features = (data || []).map(node => ({
                type: 'Feature',
                geometry: { type:'Point', coordinates: [parseFloat(node.lng), parseFloat(node.lat)] },
                properties: {
                    id: node.id, intent: node.intent || 'Coffee',
                    category: node.category || 'social',
                    node_type: node.node_type || 'one_on_one',
                    vibe_question: node.vibe_question,
                    vibe_answer: node.vibe_answer,
                    user_id: node.user_id,
                    color: '#FFD700',
                    emoji: '📍',
                    expires_at: node.expires_at
                }
            }));
            if (map.getSource('nodes-source')) map.getSource('nodes-source').setData({ type:'FeatureCollection', features });
            if (features.length === 0) setStatus('info','No active nodes in this area. Scanning...');
            else document.getElementById('status-bar').style.display='none';
        }

        // ========== HEATMAP (unchanged) ==========
        const heatmapPanel = document.createElement('div');
        heatmapPanel.id = 'heatmap-panel';
        heatmapPanel.style.cssText = 'position:absolute;top:170px;left:20px;background:rgba(0,0,0,0.9);border:1px solid #FFD700;border-radius:16px;padding:10px;display:none;flex-direction:column;gap:6px;z-index:2000;min-width:180px;max-width:240px;max-height:250px;overflow-y:auto;backdrop-filter:blur(8px)';
        document.body.appendChild(heatmapPanel);
        const heatmapToggleBtn = document.getElementById('heatmap-toggle-btn');
        let heatmapOn = false;
        let reverseGeocodeCache = new Map();

        async function getAreaName(lng, lat) {
            const key = `${lng.toFixed(3)},${lat.toFixed(3)}`;
            if (reverseGeocodeCache.has(key)) return reverseGeocodeCache.get(key);
            try {
                const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${lng},${lat}.json?access_token=${MAPBOX_TOKEN}&types=place,neighborhood,locality`;
                const res = await fetch(url);
                const data = await res.json();
                let name = '';
                if (data.features && data.features.length) {
                    const feat = data.features.find(f => f.place_type.includes('neighborhood')) || 
                                 data.features.find(f => f.place_type.includes('locality')) ||
                                 data.features[0];
                    name = feat.text;
                    if (feat.context) {
                        const city = feat.context.find(c => c.id.includes('place'));
                        if (city) name += `, ${city.text}`;
                    }
                }
                if (!name) name = `${lat.toFixed(2)},${lng.toFixed(2)}`;
                reverseGeocodeCache.set(key, name);
                return name;
            } catch (e) {
                return `${lat.toFixed(2)},${lng.toFixed(2)}`;
            }
        }

        async function fetchNodesWithinRadius(centerLat, centerLng, radiusKm) {
            const delta = radiusKm / 111;
            const latMin = centerLat - delta;
            const latMax = centerLat + delta;
            const lngMin = centerLng - delta / Math.cos(centerLat * Math.PI / 180);
            const lngMax = centerLng + delta / Math.cos(centerLat * Math.PI / 180);
            const { data, error } = await _supabase
                .from('nodes')
                .select('id, lat, lng')
                .eq('status', 'active')
                .gt('expires_at', new Date().toISOString())
                .gte('lat', latMin)
                .lte('lat', latMax)
                .gte('lng', lngMin)
                .lte('lng', lngMax);
            if (error) throw error;
            return (data || []).filter(node => haversine(centerLat, centerLng, node.lat, node.lng) <= radiusKm);
        }

        function groupNodesByGrid(nodes, cellSizeDeg = 0.02) {
            const grid = new Map();
            nodes.forEach(node => {
                const cellLat = Math.floor(node.lat / cellSizeDeg) * cellSizeDeg;
                const cellLng = Math.floor(node.lng / cellSizeDeg) * cellSizeDeg;
                const key = `${cellLat},${cellLng}`;
                if (!grid.has(key)) grid.set(key, { lat: cellLat + cellSizeDeg/2, lng: cellLng + cellSizeDeg/2, count: 0 });
                grid.get(key).count++;
            });
            return Array.from(grid.values()).sort((a,b) => b.count - a.count);
        }

        function showToast(message, targetElement) {
            const toast = document.createElement('div');
            toast.className = 'heatmap-toast';
            toast.innerText = message;
            document.body.appendChild(toast);
            const rect = targetElement.getBoundingClientRect();
            toast.style.left = rect.right + 10 + 'px';
            toast.style.top = rect.top + (rect.height/2) - 10 + 'px';
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function updateHeatmapPanel() {
            if (!heatmapOn) return;
            const loadingDiv = document.getElementById('heatmap-loading');
            if (loadingDiv) loadingDiv.style.display = 'block';
            try {
                let centerLat = myLoc.lat;
                let centerLng = myLoc.lng;
                if (!centerLat || centerLat === 0) {
                    const mapCenter = map.getCenter();
                    centerLat = mapCenter.lat;
                    centerLng = mapCenter.lng;
                }
                const nodes = await fetchNodesWithinRadius(centerLat, centerLng, HEATMAP_RADIUS_KM);
                const totalNodes = nodes.length;
                if (!nodes.length) {
                    heatmapPanel.innerHTML = '<div style="color:#aaa;font-size:11px;padding:5px">No active nodes nearby</div>';
                    return;
                }
                const cells = groupNodesByGrid(nodes, HEATMAP_CELL_SIZE_DEG);
                const eligibleCells = cells.filter(cell => cell.count >= MIN_NODES_FOR_HEATMAP);
                let html = `<div class="total-count">📊 TOTAL ACTIVE NODES: ${totalNodes}</div>`;
                if (eligibleCells.length === 0) {
                    html += `<div style="color:#aaa;font-size:11px;padding:5px">No area with ≥${MIN_NODES_FOR_HEATMAP} nodes</div>`;
                } else {
                    for (const cell of eligibleCells) {
                        let dotColor, intensityChar;
                        if (cell.count >= 10) { dotColor = '#ff5050'; intensityChar = '🔴'; }
                        else if (cell.count >= 3) { dotColor = '#FFD700'; intensityChar = '🟡'; }
                        else { dotColor = '#80ff80'; intensityChar = '🟢'; }
                        const areaName = await getAreaName(cell.lng, cell.lat);
                        html += `
                            <div class="heatmap-row" data-name="${areaName.replace(/"/g, '&quot;')}" data-count="${cell.count}" data-intensity="${intensityChar}">
                                <div class="heatmap-dot" style="background:${dotColor}; box-shadow:0 0 4px ${dotColor};"></div>
                                <div class="heatmap-label">${intensityChar} ${areaName}</div>
                                <div class="heatmap-count">${cell.count} node${cell.count !== 1 ? 's' : ''}</div>
                            </div>
                        `;
                    }
                }
                heatmapPanel.innerHTML = html;
                document.querySelectorAll('#heatmap-panel .heatmap-row').forEach(el => {
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const name = el.dataset.name;
                        const count = el.dataset.count;
                        const intensity = el.dataset.intensity;
                        showToast(`${intensity} ${count} node${count !== 1 ? 's' : ''} in ${name}`, el);
                    });
                });
            } catch (err) {
                console.error(err);
                heatmapPanel.innerHTML = '<div style="color:#f00;font-size:11px;padding:5px">Error loading data</div>';
            } finally {
                if (loadingDiv) loadingDiv.style.display = 'none';
            }
        }

        async function toggleHeatmap() {
            heatmapOn = !heatmapOn;
            heatmapToggleBtn.style.background = heatmapOn ? '#FFD700' : '#000';
            heatmapToggleBtn.style.color = heatmapOn ? '#000' : '#FFD700';
            if (!heatmapOn) {
                heatmapPanel.style.display = 'none';
                heatmapPanel.innerHTML = '';
            } else {
                heatmapPanel.style.display = 'flex';
                await updateHeatmapPanel();
            }
        }
        heatmapToggleBtn.addEventListener('click', toggleHeatmap);
        map.on('moveend', () => { if (heatmapOn) updateHeatmapPanel(); });

        // ========== MODE TOGGLE (unchanged) ==========
        function setMode(mode){
            if (currentN && currentN.id){
                setStatus('error','Cannot switch mode while in an active connection. Terminate first.');
                return;
            }
            currentMode = mode;
            document.getElementById('mode-browse').classList.toggle('active', mode === 'browse');
            document.getElementById('mode-create').classList.toggle('active', mode === 'create');
            document.getElementById('fab').style.display = mode === 'create' ? 'flex' : 'none';
            document.getElementById('profile-gear').style.display = mode === 'create' ? 'flex' : 'none';
            closeIntentPanel();
            closeProfileCard();
            if (mode === 'browse') scan();
        }
        document.getElementById('mode-browse').addEventListener('click', () => setMode('browse'));
        document.getElementById('mode-create').addEventListener('click', () => setMode('create'));
        setMode('browse');

        // Generate map labels from ZONES data
        const labelsContainer = document.getElementById('map-labels-container');
        if (labelsContainer) {
            ZONES.forEach(zone => {
                const labelDiv = document.createElement('div');
                labelDiv.innerText = zone.name;
                labelDiv.style.top = zone.top;
                labelDiv.style.left = zone.left;
                labelsContainer.appendChild(labelDiv);
            });
        }
    </script>
</body>
</html>
