<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seeker - Map</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css' rel='stylesheet' />
    <style>
        body { margin: 0; padding: 0; height: 100vh; display: flex; }
        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #1e1e2f;
            color: white;
            padding: 20px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .sidebar h2 { margin: 0 0 10px; font-size: 20px; color: #e74c3c; }
        .sidebar label { font-size: 14px; }
        .sidebar select, .sidebar input[type="range"] { width: 100%; padding: 6px; margin-top: 4px; border-radius: 4px; border: none; }
        .sidebar button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        /* Map container */
        #map { flex: 1; position: relative; }

        /* Heatmap toggle (top right) */
        .toggle-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 2;
            background: white;
            padding: 8px 14px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: Arial, sans-serif;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 22px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #e74c3c; }
        input:checked + .slider:before { transform: translateX(22px); }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h2>🔍 Seeker View</h2>
        <label>Intensity Filter</label>
        <input type="range" min="0" max="100" value="50" id="intensitySlider" />
        <label>Category</label>
        <select id="categorySelect">
            <option value="all">All</option>
            <option value="intent">Intent Nodes</option>
        </select>
        <button id="refreshBtn">Refresh Data</button>
        <div style="margin-top: auto; font-size: 12px; opacity: 0.7;">
            © 2026 · Project Heatmap
        </div>
    </div>

    <!-- Map -->
    <div id="map">
        <!-- Heatmap toggle -->
        <div class="toggle-container">
            <span><strong>Heatmap</strong></span>
            <label class="switch">
                <input type="checkbox" id="heatmapSwitch" />
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <script>
        // ===== MAPBOX TOKEN =====
        mapboxgl.accessToken = 'pk.eyJ1IjoiYmFkYXJraGFuMTE1IiwiYSI6ImNtb2dybG02cDB6bXAyd3M2dDZoeGR3ZzAifQ.-Bepjo9kyGavV3lO3LOWug';

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: [55.38, 25.25],  // Dubai / Sharjah
            zoom: 10
        });

        map.on('load', () => {
            // 1. Add intent nodes source (sample data – replace with your actual data)
            map.addSource('intent-nodes', {
                type: 'geojson',
                data: {
                    type: 'FeatureCollection',
                    features: [
                        { type: 'Feature', geometry: { type: 'Point', coordinates: [55.365, 25.35] }, properties: { weight: 1.0, category: 'intent' } },
                        { type: 'Feature', geometry: { type: 'Point', coordinates: [55.364, 25.252] }, properties: { weight: 2.0, category: 'intent' } },
                        { type: 'Feature', geometry: { type: 'Point', coordinates: [55.405, 25.215] }, properties: { weight: 1.5, category: 'intent' } },
                        { type: 'Feature', geometry: { type: 'Point', coordinates: [55.440, 25.160] }, properties: { weight: 2.5, category: 'intent' } },
                        { type: 'Feature', geometry: { type: 'Point', coordinates: [55.270, 25.330] }, properties: { weight: 0.8, category: 'intent' } }
                    ]
                }
            });

            // 2. Visible markers (red circles)
            map.addLayer({
                id: 'intent-markers',
                type: 'circle',
                source: 'intent-nodes',
                paint: {
                    'circle-radius': [
                        'interpolate', ['linear'], ['zoom'],
                        8, 4,
                        14, 12
                    ],
                    'circle-color': '#ff4d4d',
                    'circle-opacity': 0.9,
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#ffffff'
                },
                filter: ['==', ['get', 'category'], 'intent']
            });

            // 3. Heatmap layer (hidden by default)
            map.addLayer({
                id: 'heatmap-layer',
                type: 'heatmap',
                source: 'intent-nodes',
                paint: {
                    'heatmap-weight': ['get', 'weight'],
                    'heatmap-intensity': 1.2,
                    'heatmap-radius': 35,
                    'heatmap-opacity': 0.7,
                    'heatmap-color': [
                        'interpolate', ['linear'], ['heatmap-density'],
                        0, 'rgba(33,102,172,0)',
                        0.2, 'rgb(103,169,207)',
                        0.4, 'rgb(209,229,240)',
                        0.6, 'rgb(253,219,199)',
                        0.8, 'rgb(239,138,98)',
                        1, 'rgb(178,24,43)'
                    ]
                },
                layout: {
                    'visibility': 'none'   // start hidden
                }
            });

            // 4. Toggle logic
            const toggle = document.getElementById('heatmapSwitch');
            toggle.addEventListener('change', (e) => {
                map.setLayoutProperty(
                    'heatmap-layer',
                    'visibility',
                    e.target.checked ? 'visible' : 'none'
                );
            });

            // 5. Sidebar stuff (just for show)
            document.getElementById('refreshBtn').addEventListener('click', () => {
                alert('Refresh clicked – add your data refresh logic here.');
            });
        });
    </script>
</body>
</html>
