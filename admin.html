<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VESSEL | ADMIN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body,html{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:monospace}
        #login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#FFD700}
        #login-screen input{padding:10px;background:#000;border:1px solid #FFD700;color:#FFD700;margin:10px 0;width:200px;text-align:center}
        #login-screen button{background:#FFD700;color:#000;border:none;padding:10px 30px;cursor:pointer;font-weight:bold;margin:5px}
        #dashboard{display:none;flex-direction:column;height:100%}
        #top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid #FFD700;color:#FFD700}
        #top-bar button{background:transparent;border:1px solid #FFD700;color:#FFD700;padding:6px 15px;cursor:pointer}
        #tabs{display:flex;flex-wrap:wrap;gap:10px;padding:10px 20px;border-bottom:1px solid #333}
        .tab-btn{background:transparent;border:1px solid #FFD700;color:#FFD700;padding:8px 16px;cursor:pointer;font-size:12px}
        .tab-btn.active{background:#FFD700;color:#000}
        #content{flex:1;overflow-y:auto;padding:20px;color:#FFD700}
        .stats-row{display:flex;flex-wrap:wrap;gap:15px;margin-bottom:20px}
        .stat-card{background:#111;border:1px solid #FFD700;padding:15px;flex:1;min-width:150px;text-align:center}
        .stat-card h3{font-size:28px;margin:0}
        .stat-card p{margin:5px 0 0;font-size:11px;color:#aaa}
        table{width:100%;border-collapse:collapse;margin-top:15px;font-size:12px}
        th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #333}
        th{color:#FFD700;font-size:11px;text-transform:uppercase}
        tr:hover{background:rgba(255,215,0,0.05);cursor:pointer}
        .action-btn{background:transparent;border:1px solid #FFD700;color:#FFD700;padding:3px 10px;cursor:pointer;font-size:11px;margin-right:3px}
        .action-btn.danger{border-color:#f00;color:#f00}
        .search-input{width:100%;padding:8px;background:#000;border:1px solid #FFD700;color:#FFD700;margin-bottom:15px}
        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:999;align-items:center;justify-content:center}
        .modal-box{background:#000;border:2px solid #FFD700;padding:20px;max-width:500px;width:90%;color:#FFD700;text-align:left;max-height:80vh;overflow-y:auto}
        .modal-box button{margin:5px;background:transparent;border:1px solid #FFD700;color:#FFD700;padding:8px 20px;cursor:pointer}
        .form-group{margin-bottom:12px}
        .form-group label{display:block;font-size:12px;margin-bottom:4px}
        .form-group input,.form-group textarea{width:100%;padding:8px;background:#000;border:1px solid #FFD700;color:#FFD700;font-family:monospace}
        .toast{position:fixed;top:20px;right:20px;background:#333;border:1px solid #FFD700;color:#FFD700;padding:10px 20px;z-index:1000;display:none}
        /* Chart styles */
        .chart-container{margin-bottom:30px}
        .chart-container h3{margin-bottom:15px;font-size:16px}
        .bar-row{display:flex;align-items:center;margin-bottom:8px}
        .bar-label{width:100px;font-size:11px;text-align:right;padding-right:10px}
        .bar-track{flex:1;background:#222;height:20px;position:relative}
        .bar-fill{height:100%;background:#FFD700;position:absolute;left:0;top:0;transition:width 0.3s}
        .bar-value{width:60px;font-size:11px;padding-left:10px}
        .line-chart{display:flex;align-items:flex-end;gap:4px;height:180px;padding:10px 0;border-bottom:1px solid #333}
        .line-bar{flex:1;background:#FFD700;min-width:20px;position:relative;transition:height 0.3s}
        .line-bar span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:9px;color:#aaa}
        .heatmap-grid{display:grid;grid-template-columns:80px repeat(24,1fr);gap:2px;font-size:10px;margin-top:10px}
        .heatmap-cell{background:#222;text-align:center;padding:4px 0;color:#aaa}
        .heatmap-cell.high{background:#FFD700;color:#000}
        .heatmap-cell.medium{background:#b38600;color:#000}
    </style>
</head>
<body>
    <div id="login-screen">
        <h2>VESSEL ADMIN</h2>
        <input type="password" id="pw" placeholder="Password">
        <button onclick="login()">LOGIN</button>
        <button onclick="testConnection()" style="background:transparent;border:1px dashed #FFD700;color:#FFD700;">TEST CONNECTION</button>
        <p id="login-error" style="color:#f00;display:none;"></p>
    </div>

    <div id="dashboard">
        <div id="top-bar">
            <h2>VESSEL ADMIN</h2>
            <button onclick="logout()">LOGOUT</button>
        </div>
        <div id="tabs">
            <button class="tab-btn active" onclick="switchTab('stats')">STATS</button>
            <button class="tab-btn" onclick="switchTab('users')">USERS</button>
            <button class="tab-btn" onclick="switchTab('nodes')">NODES</button>
            <button class="tab-btn" onclick="switchTab('intents')">INTENTS</button>
            <button class="tab-btn" onclick="switchTab('tags')">TAGS</button>
            <button class="tab-btn" onclick="switchTab('banners')">BANNERS</button>
            <button class="tab-btn" onclick="switchTab('analytics')">ANALYTICS</button>
            <button class="tab-btn" onclick="switchTab('logs')">LOGS</button>
            <button class="tab-btn" onclick="switchTab('settings')">SETTINGS</button>
        </div>
        <div id="content"></div>
    </div>

    <div id="modal" class="modal-overlay"><div class="modal-box" id="modal-content"></div></div>
    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script>
        if (typeof window.supabase === 'undefined') {
            document.body.innerHTML = '<h2 style="color:red;text-align:center;margin-top:50px;">Supabase library failed to load. Hard refresh (Ctrl+Shift+R) or try an incognito window.</h2>';
            throw new Error('Supabase not loaded');
        }

        const SUPABASE_URL = 'https://rnroyhkvkmzuichysxnk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJucm95aGt2a216dWljaHlzeG5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5MjIzMDAsImV4cCI6MjA5MjQ5ODMwMH0.O1poxwOr2kESKiqRTgkb86AFFwIN8wEMuW10UEsp_DU';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isLoggedIn = false;
        let currentTab = 'stats';

        if(localStorage.getItem('admin_logged_in') === 'true') {
            document.getElementById('login-screen').style.display='none';
            document.getElementById('dashboard').style.display='flex';
            isLoggedIn = true;
            loadTab('stats');
        }

        function showLoginError(msg) {
            document.getElementById('login-error').style.display = 'block';
            document.getElementById('login-error').innerText = msg;
        }

        async function testConnection() {
            try {
                const { data, error } = await supabase.from('admin_config').select('*').limit(1);
                if (error) { alert('Connection failed: ' + error.message); }
                else { alert('Connection OK. Got ' + data.length + ' config row(s).'); }
            } catch (e) { alert('Supabase client error: ' + e.message); }
        }

        async function login() {
            const pw = document.getElementById('pw').value;
            if (!pw) { showLoginError('Please enter a password.'); return; }
            try {
                const encoder = new TextEncoder();
                const hashBuffer = await crypto.subtle.digest('SHA-256', encoder.encode(pw));
                const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,'0')).join('');
                const { data: configRow, error } = await supabase.from('admin_config').select('value').eq('key','admin_password').single();
                if (error) { alert('Database error: ' + error.message); return; }
                if (!configRow) { alert('admin_config table empty. Run the SQL to insert a password.'); return; }
                if (hashHex === configRow.value) {
                    localStorage.setItem('admin_logged_in', 'true');
                    document.getElementById('login-screen').style.display='none';
                    document.getElementById('dashboard').style.display='flex';
                    isLoggedIn = true;
                    loadTab('stats');
                } else { showLoginError('Invalid password.'); }
            } catch (e) { alert('Login error: ' + e.message); }
        }

        function logout() {
            localStorage.removeItem('admin_logged_in');
            isLoggedIn = false;
            document.getElementById('dashboard').style.display='none';
            document.getElementById('login-screen').style.display='flex';
            document.getElementById('pw').value = '';
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
            event.target.classList.add('active');
            loadTab(tab);
        }

        async function loadTab(tab) {
            const content = document.getElementById('content');
            switch(tab) {
                case 'stats': content.innerHTML = await getStatsHTML(); break;
                case 'users': content.innerHTML = await getUsersHTML(); break;
                case 'nodes': content.innerHTML = await getNodesHTML(); break;
                case 'intents': content.innerHTML = await getIntentsHTML(); break;
                case 'tags': content.innerHTML = await getTagsHTML(); break;
                case 'banners': content.innerHTML = await getBannersHTML(); break;
                case 'analytics': content.innerHTML = await getAnalyticsHTML(); break;
                case 'logs': content.innerHTML = await getLogsHTML(); break;
                case 'settings': content.innerHTML = await getSettingsHTML(); break;
            }
        }

        // ---------- STATS ----------
        async function getStatsHTML() {
            const now = new Date().toISOString();
            const today = new Date(); today.setHours(0,0,0,0); const todayISO = today.toISOString();
            const [usersRes, nodesRes, meetsRes, nodesTodayRes] = await Promise.all([
                supabase.from('users').select('*', { count: 'exact', head: true }),
                supabase.from('nodes').select('*', { count: 'exact', head: true }).eq('status','active').gt('expires_at', now),
                supabase.from('oracle_sessions').select('*', { count: 'exact', head: true }).gte('created_at', todayISO).eq('meet_completed', true),
                supabase.from('nodes').select('*', { count: 'exact', head: true }).gte('created_at', todayISO)
            ]);
            return `<div class="stats-row">
                <div class="stat-card"><h3>${usersRes.count||0}</h3><p>Total Users</p></div>
                <div class="stat-card"><h3>${nodesRes.count||0}</h3><p>Active Nodes</p></div>
                <div class="stat-card"><h3>${meetsRes.count||0}</h3><p>Meets Today</p></div>
                <div class="stat-card"><h3>${nodesTodayRes.count||0}</h3><p>Nodes Created Today</p></div>
            </div>`;
        }

        // ---------- USERS ----------
        async function getUsersHTML() {
            const { data: users, error } = await supabase.from('users').select('*').order('created_at', { ascending: false });
            if(error) return '<p>Error loading users.</p>';
            let html = '<input class="search-input" id="userSearch" placeholder="Search by name, ID, or status..." oninput="filterUsers()">';
            html += '<table id="userTable"><thead><tr><th>Avatar</th><th>Name</th><th>Trust</th><th>Meets</th><th>Age</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
            users.forEach(u => {
                const status = u.status || 'active';
                html += `<tr data-name="${u.display_name||''}" data-id="${u.id}" data-status="${status}" onclick="showUserDetail('${u.id}')">
                    <td>${u.avatar_emoji||'🤖'}</td>
                    <td>${u.display_name||'Unknown'}</td>
                    <td>⭐${(u.trust_score||5).toFixed(1)}</td>
                    <td>${u.total_meets||0}</td>
                    <td>${u.age||'N/A'}</td>
                    <td style="color:${status==='active'?'#0f0':'#f00'}">${status}</td>
                    <td onclick="event.stopPropagation()">
                        ${status==='active' ? 
                            `<button class="action-btn" onclick="suspendUser('${u.id}')">Suspend</button>
                             <button class="action-btn danger" onclick="banUser('${u.id}')">Ban</button>` :
                            `<button class="action-btn" onclick="reactivateUser('${u.id}')">Reactivate</button>`
                        }
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';
            return html;
        }

        function filterUsers() {
            const q = document.getElementById('userSearch').value.toLowerCase();
            document.querySelectorAll('#userTable tbody tr').forEach(row => {
                const name = row.getAttribute('data-name').toLowerCase();
                const id = row.getAttribute('data-id').toLowerCase();
                const status = row.getAttribute('data-status').toLowerCase();
                row.style.display = (name.includes(q) || id.includes(q) || status.includes(q)) ? '' : 'none';
            });
        }

        async function suspendUser(userId) {
            showModal('Suspend this user?', async () => {
                const { error } = await supabase.from('users').update({ status: 'suspended' }).eq('id', userId);
                if(error) toast('Failed', true); else { toast('User suspended'); loadTab('users'); }
                closeModal();
            });
        }

        async function banUser(userId) {
            showModal('Permanently ban this user?', async () => {
                const { error } = await supabase.from('users').update({ status: 'banned' }).eq('id', userId);
                if(error) toast('Failed', true); else { toast('User banned'); loadTab('users'); }
                closeModal();
            });
        }

        async function reactivateUser(userId) {
            showModal('Reactivate this user?', async () => {
                const { error } = await supabase.from('users').update({ status: 'active' }).eq('id', userId);
                if(error) toast('Failed', true); else { toast('User reactivated'); loadTab('users'); }
                closeModal();
            });
        }

        async function showUserDetail(userId) {
            const { data: user, error } = await supabase.from('users').select('*').eq('id', userId).single();
            if(error || !user) return;
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <h3>${user.avatar_emoji||'🤖'} ${user.display_name||'Unknown'}</h3>
                <p>ID: ${user.id}</p>
                <p>Age: ${user.age||'N/A'}</p>
                <p>Nationality: ${user.nationality||'N/A'}</p>
                <p>Profession: ${user.profession||'N/A'}</p>
                <p>Trust Score: ⭐${(user.trust_score||5).toFixed(1)}</p>
                <p>Total Meets: ${user.total_meets||0}</p>
                <p>Status: ${user.status||'active'}</p>
                <p>Vibe Tags: ${(user.vibe_tags||[]).join(', ')||'None'}</p>
                <p>Joined: ${new Date(user.created_at).toLocaleDateString()}</p>
                <button onclick="closeModal()">Close</button>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        // ---------- NODES ----------
        async function getNodesHTML() {
            const now = new Date().toISOString();
            const { data: nodes, error } = await supabase.from('nodes').select('*').order('created_at', { ascending: false }).limit(200);
            if(error) return '<p>Error loading nodes.</p>';
            let html = '<table><thead><tr><th>Intent</th><th>Category</th><th>Type</th><th>Status</th><th>Creator ID</th><th>Location</th><th>Expires</th><th>Actions</th></tr></thead><tbody>';
            nodes.forEach(n => {
                const coords = `(${parseFloat(n.lat).toFixed(4)}, ${parseFloat(n.lng).toFixed(4)})`;
                const expires = n.expires_at ? new Date(n.expires_at).toLocaleString() : 'N/A';
                html += `<tr onclick="showNodeDetail(${n.id})">
                    <td>${n.intent||'N/A'}</td>
                    <td>${n.category||'social'}</td>
                    <td>${n.node_type||'one_on_one'}</td>
                    <td style="color:${n.status==='active'?'#0f0':'#f00'}">${n.status||'active'}</td>
                    <td>${n.user_id}</td>
                    <td>${coords}</td>
                    <td>${expires}</td>
                    <td onclick="event.stopPropagation()">
                        ${n.status === 'active' ? `<button class="action-btn danger" onclick="expireNode(${n.id})">Expire</button>` : ''}
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';
            return html;
        }

        async function showNodeDetail(nodeId) {
            const { data: node, error } = await supabase.from('nodes').select('*').eq('id', nodeId).single();
            if(error || !node) return;
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <h3>Node Detail</h3>
                <p><b>ID:</b> ${node.id}</p>
                <p><b>Intent:</b> ${node.intent||'N/A'}</p>
                <p><b>Category:</b> ${node.category||'social'}</p>
                <p><b>Type:</b> ${node.node_type||'one_on_one'} ${node.max_participants ? '(max '+node.max_participants+')' : ''}</p>
                <p><b>Status:</b> ${node.status||'active'}</p>
                <p><b>Creator ID:</b> ${node.user_id}</p>
                <p><b>Location:</b> ${parseFloat(node.lat).toFixed(4)}, ${parseFloat(node.lng).toFixed(4)}</p>
                ${node.vibe_question ? `<p><b>Vibe Question:</b> ${node.vibe_question}</p>` : ''}
                ${node.vibe_answer ? `<p><b>Vibe Answer:</b> ${node.vibe_answer}</p>` : ''}
                <p><b>Created:</b> ${new Date(node.created_at).toLocaleString()}</p>
                <p><b>Expires:</b> ${node.expires_at ? new Date(node.expires_at).toLocaleString() : 'N/A'}</p>
                <hr>
                <button onclick="closeModal()">Close</button>
                ${node.status !== 'expired' ? `<button onclick="expireNode(${node.id}); closeModal();">Expire Node</button>` : ''}
                <button style="border-color:#f00;color:#f00" onclick="deleteNode(${node.id})">Delete Permanently</button>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        async function expireNode(nodeId) {
            showModal('Force‑expire this node?', async () => {
                const { error } = await supabase.from('nodes').update({ status: 'expired' }).eq('id', nodeId);
                if(error) toast('Failed', true); else { toast('Node expired'); loadTab('nodes'); }
                closeModal();
            });
        }

        async function deleteNode(nodeId) {
            showModal('Permanently delete this node? This cannot be undone.', async () => {
                const { error } = await supabase.from('nodes').delete().eq('id', nodeId);
                if(error) toast('Failed', true); else { toast('Node deleted permanently'); loadTab('nodes'); }
                closeModal();
            });
        }

        // ---------- CUSTOM INTENTS ----------
        async function getIntentsHTML() {
            const { data: nodes, error } = await supabase.from('nodes').select('*').not('custom_intent', 'is', null).order('created_at', { ascending: false });
            if(error) return '<p>Error loading custom intents.</p>';
            if(!nodes || nodes.length === 0) return '<p>No custom intents found.</p>';
            let html = '<table><thead><tr><th>Node ID</th><th>Custom Intent</th><th>Creator ID</th><th>Category</th><th>Actions</th></tr></thead><tbody>';
            nodes.forEach(n => {
                html += `<tr>
                    <td>${n.id}</td>
                    <td>${n.custom_intent}</td>
                    <td>${n.user_id}</td>
                    <td>${n.category||'social'}</td>
                    <td><button class="action-btn danger" onclick="clearCustomIntent(${n.id})">Clear</button></td>
                </tr>`;
            });
            html += '</tbody></table>';
            return html;
        }

        async function clearCustomIntent(nodeId) {
            showModal('Clear this custom intent?', async () => {
                const { error } = await supabase.from('nodes').update({ custom_intent: null }).eq('id', nodeId);
                if(error) toast('Failed', true); else { toast('Custom intent cleared'); loadTab('intents'); }
                closeModal();
            });
        }

        // ---------- VIBE TAGS ----------
        async function getTagsHTML() {
            const { data: users, error } = await supabase.from('users').select('*').not('vibe_tags', 'is', null).order('created_at', { ascending: false });
            if(error) return '<p>Error loading vibe tags.</p>';
            if(!users || users.length === 0) return '<p>No vibe tags found.</p>';
            let html = '<table><thead><tr><th>User</th><th>Tags</th><th>Actions</th></tr></thead><tbody>';
            users.forEach(u => {
                const tags = u.vibe_tags || [];
                const tagButtons = tags.map(tag => 
                    `<button class="action-btn danger" style="margin:2px" onclick="removeVibeTag('${u.id}', '${tag.replace(/'/g, "\\'")}')">${tag} ✕</button>`
                ).join(' ');
                html += `<tr>
                    <td>${u.display_name||'Unknown'} (${u.id})</td>
                    <td>${tagButtons || '<em>No tags</em>'}</td>
                    <td><button class="action-btn danger" onclick="clearAllVibeTags('${u.id}')">Clear All</button></td>
                </tr>`;
            });
            html += '</tbody></table>';
            return html;
        }

        async function removeVibeTag(userId, tagToRemove) {
            const { data: user, error } = await supabase.from('users').select('vibe_tags').eq('id', userId).single();
            if(error || !user) { toast('Failed to fetch user', true); return; }
            const newTags = (user.vibe_tags || []).filter(t => t !== tagToRemove);
            const { error: updateError } = await supabase.from('users').update({ vibe_tags: newTags }).eq('id', userId);
            if(updateError) toast('Failed', true); else { toast('Tag removed'); loadTab('tags'); }
        }

        async function clearAllVibeTags(userId) {
            showModal('Clear ALL vibe tags for this user?', async () => {
                const { error } = await supabase.from('users').update({ vibe_tags: [] }).eq('id', userId);
                if(error) toast('Failed', true); else { toast('All tags cleared'); loadTab('tags'); }
                closeModal();
            });
        }

        // ---------- BANNER / SPONSOR MANAGER ----------
        async function getBannersHTML() {
            const { data: banners, error } = await supabase.from('banners').select('*').order('created_at', { ascending: false });
            if(error) return '<p>Error loading banners.</p>';
            let html = '<button class="action-btn" style="margin-bottom:15px" onclick="showBannerForm()">+ Add Banner</button>';
            if(!banners || banners.length === 0) return html + '<p>No banners found.</p>';
            html += '<table><thead><tr><th>Title</th><th>Message</th><th>Location</th><th>Expires</th><th>Active</th><th>Impressions</th><th>Actions</th></tr></thead><tbody>';
            banners.forEach(b => {
                html += `<tr>
                    <td>${b.title||'N/A'}</td>
                    <td>${b.message||'N/A'}</td>
                    <td>(${parseFloat(b.lat).toFixed(4)}, ${parseFloat(b.lng).toFixed(4)})</td>
                    <td>${b.expires_at ? new Date(b.expires_at).toLocaleDateString() : 'Never'}</td>
                    <td style="color:${b.is_active?'#0f0':'#f00'}">${b.is_active ? 'ON' : 'OFF'}</td>
                    <td>${b.impression_count||0}</td>
                    <td>
                        <button class="action-btn" onclick="showBannerForm('${b.id}')">Edit</button>
                        <button class="action-btn" onclick="toggleBanner('${b.id}', ${b.is_active})">${b.is_active?'Deactivate':'Activate'}</button>
                        <button class="action-btn danger" onclick="deleteBanner('${b.id}')">Delete</button>
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';
            return html;
        }

        function showBannerForm(bannerId = null) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            const isEdit = !!bannerId;
            content.innerHTML = `<h3>${isEdit ? 'Edit' : 'Add'} Banner</h3>
                <div class="form-group"><label>Title</label><input id="banner-title" placeholder="e.g., Golden Café"></div>
                <div class="form-group"><label>Message</label><input id="banner-msg" placeholder="20% off lattes"></div>
                <div class="form-group"><label>Image URL (optional)</label><input id="banner-img" placeholder="https://..."></div>
                <div class="form-group"><label>Latitude</label><input id="banner-lat" type="number" step="any" placeholder="25.0800"></div>
                <div class="form-group"><label>Longitude</label><input id="banner-lng" type="number" step="any" placeholder="55.1400"></div>
                <div class="form-group"><label>Expiry Date</label><input id="banner-expiry" type="date"></div>
                <div class="form-group"><label>Active</label><input id="banner-active" type="checkbox" checked></div>
                <button onclick="saveBanner('${bannerId||''}')">${isEdit ? 'Update' : 'Create'}</button>
                <button onclick="closeModal()">Cancel</button>`;
            modal.style.display = 'flex';

            if(isEdit) {
                (async () => {
                    const { data:banner, error } = await supabase.from('banners').select('*').eq('id', bannerId).single();
                    if(!banner) return;
                    document.getElementById('banner-title').value = banner.title || '';
                    document.getElementById('banner-msg').value = banner.message || '';
                    document.getElementById('banner-img').value = banner.image_url || '';
                    document.getElementById('banner-lat').value = banner.lat || '';
                    document.getElementById('banner-lng').value = banner.lng || '';
                    document.getElementById('banner-expiry').value = banner.expires_at ? banner.expires_at.split('T')[0] : '';
                    document.getElementById('banner-active').checked = banner.is_active;
                })();
            }
        }

        async function saveBanner(bannerId) {
            const title = document.getElementById('banner-title').value.trim();
            const message = document.getElementById('banner-msg').value.trim();
            const imageUrl = document.getElementById('banner-img').value.trim();
            const lat = parseFloat(document.getElementById('banner-lat').value);
            const lng = parseFloat(document.getElementById('banner-lng').value);
            const expiresAt = document.getElementById('banner-expiry').value;
            const isActive = document.getElementById('banner-active').checked;

            if(!title || !message || isNaN(lat) || isNaN(lng)) {
                toast('Please fill all required fields (title, message, lat, lng).', true);
                return;
            }

            const bannerData = {
                title, message, image_url: imageUrl || null,
                lat, lng,
                expires_at: expiresAt ? new Date(expiresAt).toISOString() : null,
                is_active: isActive
            };

            let error;
            if(bannerId) {
                const result = await supabase.from('banners').update(bannerData).eq('id', bannerId);
                error = result.error;
            } else {
                const result = await supabase.from('banners').insert([bannerData]);
                error = result.error;
            }

            if(error) toast('Failed to save banner: ' + error.message, true);
            else { toast('Banner saved successfully'); loadTab('banners'); }
            closeModal();
        }

        async function toggleBanner(bannerId, currentState) {
            const { error } = await supabase.from('banners').update({ is_active: !currentState }).eq('id', bannerId);
            if(error) toast('Failed to toggle banner', true);
            else { toast('Banner ' + (!currentState?'activated':'deactivated')); loadTab('banners'); }
        }

        async function deleteBanner(bannerId) {
            showModal('Delete this banner permanently?', async () => {
                const { error } = await supabase.from('banners').delete().eq('id', bannerId);
                if(error) toast('Failed', true);
                else { toast('Banner deleted'); loadTab('banners'); }
                closeModal();
            });
        }

        // ---------- ANALYTICS CHARTS ----------
        async function getAnalyticsHTML() {
            const sevenDaysAgo = new Date(Date.now() - 7*24*60*60*1000).toISOString();
            const { data: meetsRaw, error: meetsError } = await supabase
                .from('oracle_sessions')
                .select('bridge_id, created_at')
                .gte('created_at', sevenDaysAgo)
                .eq('meet_completed', true);

            let meetsByCategory = {};
            if(meetsRaw && meetsRaw.length > 0) {
                const bridgeIds = meetsRaw.map(m => m.bridge_id).filter(id => id != null);
                if(bridgeIds.length > 0) {
                    const { data: nodesData } = await supabase
                        .from('nodes')
                        .select('id, category')
                        .in('id', bridgeIds);
                    if(nodesData) {
                        const nodeCategoryMap = {};
                        nodesData.forEach(n => { nodeCategoryMap[n.id] = n.category || 'social'; });
                        meetsRaw.forEach(m => {
                            const cat = nodeCategoryMap[m.bridge_id] || 'social';
                            meetsByCategory[cat] = (meetsByCategory[cat] || 0) + 1;
                        });
                    }
                }
            }

            const fourteenDaysAgo = new Date(Date.now() - 14*24*60*60*1000).toISOString();
            const { data: newUsersRaw } = await supabase
                .from('users')
                .select('created_at')
                .gte('created_at', fourteenDaysAgo);

            const dailyUsers = {};
            for(let i=0; i<14; i++) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const key = d.toISOString().split('T')[0];
                dailyUsers[key] = 0;
            }
            if(newUsersRaw) {
                newUsersRaw.forEach(u => {
                    const key = u.created_at.split('T')[0];
                    if(dailyUsers[key] !== undefined) dailyUsers[key]++;
                });
            }
            const sortedDays = Object.keys(dailyUsers).sort();

            const hourlyMeets = new Array(24).fill(0);
            if(meetsRaw) {
                meetsRaw.forEach(m => {
                    const h = new Date(m.created_at).getHours();
                    hourlyMeets[h]++;
                });
            }
            const maxHourly = Math.max(...hourlyMeets, 1);

            let html = '<div class="chart-container"><h3>Meets per Category (Last 7 Days)</h3>';
            const categories = ['social','games','work','parents'];
            const catLabels = {social:'🍻 Social', games:'⚽ Games', work:'🔧 Work', parents:'🧒 Parents'};
            const maxCat = Math.max(...Object.values(meetsByCategory), 1);
            categories.forEach(cat => {
                const count = meetsByCategory[cat] || 0;
                const pct = (count / maxCat * 100).toFixed(0);
                html += `<div class="bar-row">
                    <div class="bar-label">${catLabels[cat]||cat}</div>
                    <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
                    <div class="bar-value">${count}</div>
                </div>`;
            });
            html += '</div>';

            html += '<div class="chart-container"><h3>User Growth (Last 14 Days)</h3>';
            const maxUsers = Math.max(...Object.values(dailyUsers), 1);
            html += '<div class="line-chart">';
            sortedDays.forEach(day => {
                const count = dailyUsers[day];
                const height = Math.max(2, (count / maxUsers * 160));
                html += `<div class="line-bar" style="height:${height}px"><span>${day.slice(5)}</span></div>`;
            });
            html += '</div></div>';

            html += '<div class="chart-container"><h3>Peak Activity Hours (Last 7 Days)</h3>';
            html += '<div class="heatmap-grid"><div></div>';
            for(let h=0; h<24; h++) html += `<div style="text-align:center;font-size:9px;color:#aaa">${h}h</div>`;
            html += '<div style="text-align:right;padding-right:5px;font-size:10px;">Meets</div>';
            for(let h=0; h<24; h++) {
                const pct = hourlyMeets[h] / maxHourly;
                let cls = '';
                if(pct > 0.7) cls = 'high';
                else if(pct > 0.3) cls = 'medium';
                html += `<div class="heatmap-cell ${cls}">${hourlyMeets[h]}</div>`;
            }
            html += '</div></div>';

            return html;
        }

        // ---------- SYSTEM LOGS ----------
        async function getLogsHTML() {
            const { data: logs, error } = await supabase
                .from('logs')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(200);
            if(error) return '<p>Error loading logs.</p>';
            if(!logs || logs.length === 0) return '<p>No log entries found yet. Logs will appear here as the app runs.</p>';

            let html = '<table><thead><tr><th>Time</th><th>Event</th><th>User</th><th>Details</th></tr></thead><tbody>';
            logs.forEach(l => {
                const details = l.details ? JSON.stringify(l.details).slice(0,80) : '';
                html += `<tr>
                    <td>${new Date(l.created_at).toLocaleString()}</td>
                    <td>${l.event_type||''}</td>
                    <td>${l.user_id||''}</td>
                    <td>${details}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            return html;
        }

        // ---------- SETTINGS ----------
        async function getSettingsHTML() {
            const { data: settings, error } = await supabase.from('settings').select('*');
            if(error) return '<p>Error loading settings.</p>';
            if(!settings || settings.length === 0) return '<p>No settings found. Run the SQL to create defaults.</p>';

            // Build a form
            let html = '<h3>Global Parameters</h3>';
            html += '<div style="max-width:500px;margin-bottom:20px;">';
            settings.forEach(s => {
                html += `<div class="form-group">
                    <label>${s.key.replace(/_/g,' ')}</label>
                    <input id="set-${s.key}" value="${s.value||''}" style="width:100%">
                </div>`;
            });
            html += '<button class="action-btn" onclick="saveSettings()">Save All Settings</button>';
            html += '</div>';
            return html;
        }

        async function saveSettings() {
            const { data: allSettings } = await supabase.from('settings').select('*');
            if(!allSettings) return;
            for(let s of allSettings) {
                const input = document.getElementById('set-' + s.key);
                if(!input) continue;
                const newValue = input.value.trim();
                if(newValue !== s.value) {
                    await supabase.from('settings').update({ value: newValue }).eq('key', s.key);
                }
            }
            toast('Settings saved');
            loadTab('settings');
        }

        // Generic modal and toast
        function showModal(message, onConfirm) {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('modal-content').innerHTML = `<p>${message}</p>
                <button onclick="document.getElementById('modal').style.display='none'">Cancel</button>
                <button id="modal-confirm" style="border-color:#f00;color:#f00">Confirm</button>`;
            document.getElementById('modal-confirm').addEventListener('click', onConfirm);
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function toast(msg, isError=false) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            t.style.borderColor = isError ? '#f00' : '#FFD700';
            setTimeout(()=>t.style.display='none', 3000);
        }
    </script>
</body>
</html>
