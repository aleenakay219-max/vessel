<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VESSEL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet">
    <style>
        /* ========== STYLES (compact but complete) ========== */
        *{box-sizing:border-box}body,html{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:monospace}
        #map{height:100%;width:100%;position:absolute;top:0;z-index:1}
        #status-bar{display:none;position:fixed;top:10px;left:5%;width:90%;background:rgba(0,0,0,0.9);border:1px solid #FFD700;z-index:3000;padding:10px;text-align:center;color:#FFD700;font-size:12px;border-radius:30px}
        #mode-toggle{position:absolute;top:20px;right:20px;z-index:2000;background:#000;border:2px solid #FFD700;border-radius:30px;display:flex}
        .mode-btn{padding:8px 16px;background:transparent;border:none;color:#FFD700;font-family:monospace;font-size:12px;cursor:pointer}
        .mode-btn.active{background:#FFD700;color:#000}
        #fab{position:absolute;bottom:30px;right:30px;width:70px;height:70px;background:#000;border:2px solid #FFD700;border-radius:50%;color:#FFD700;font-size:35px;cursor:pointer;z-index:2000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 15px #FFD700}
        #profile-gear{position:absolute;top:20px;left:20px;width:36px;height:36px;background:#000;border:2px solid #FFD700;border-radius:50%;color:#FFD700;font-size:20px;cursor:pointer;z-index:2000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 10px #FFD700}
        #heatmap-toggle-btn{position:absolute;top:70px;left:20px;width:36px;height:36px;background:#000;border:2px solid #FFD700;border-radius:50%;color:#FFD700;font-size:18px;cursor:pointer;z-index:2000;display:flex;align-items:center;justify-content:center}
        #emergency-btn{position:absolute;bottom:30px;left:20px;width:50px;height:50px;background:#f00;border:2px solid #fff;border-radius:50%;color:#fff;font-size:22px;cursor:pointer;z-index:2000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 15px rgba(255,0,0,0.5)}
        #heatmap-loading{position:absolute;top:115px;left:70px;background:#000;border:1px solid #FFD700;padding:4px 8px;font-size:10px;color:#FFD700;z-index:2000;display:none;border-radius:20px}
        .heatmap-toast{position:fixed;background:#000;border:1px solid #FFD700;color:#FFD700;padding:8px 12px;border-radius:20px;font-size:11px;z-index:10000;max-width:260px;pointer-events:none}
        #heatmap-panel{position:absolute;top:115px;left:20px;background:rgba(0,0,0,0.9);border:1px solid #FFD700;border-radius:16px;padding:10px;display:none;flex-direction:column;gap:6px;z-index:2000;min-width:180px;max-width:240px;max-height:250px;overflow-y:auto;backdrop-filter:blur(8px)}
        .total-count{font-size:13px;color:#FFD700;border-bottom:1px solid #FFD700;padding-bottom:6px;margin-bottom:6px;text-align:center;font-weight:bold}
        .heatmap-row{display:flex;align-items:center;gap:10px;cursor:pointer;padding:5px 8px;border-radius:20px}
        .heatmap-row:hover{background:rgba(255,215,0,0.15)}
        .heatmap-dot{width:16px;height:16px;border-radius:50%;display:inline-block}
        .heatmap-label{font-size:12px;color:#FFD700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .heatmap-count{font-size:11px;color:#aaa;margin-left:auto}
        #terminal{display:none;position:fixed;bottom:10px;left:5%;width:90%;background:rgba(0,10,0,0.95);border:1px solid #FFD700;z-index:2000;flex-direction:column;padding:15px;border-radius:20px}
        .terminal-header{display:flex;justify-content:space-between;margin-bottom:8px}
        .three-dots{background:transparent;border:1px solid #FFD700;color:#FFD700;padding:4px 10px;border-radius:20px;cursor:pointer}
        #inbox-panel{display:none;border:1px solid #FFD700;padding:10px;margin-bottom:10px;max-height:200px;overflow-y:auto;border-radius:16px}
        #msg-box{height:150px;overflow-y:auto;color:#FFD700;margin-bottom:10px;border:1px solid #332200;padding:5px;display:flex;flex-direction:column;border-radius:16px}
        .chat-msg{max-width:80%;padding:8px 12px;margin:4px 0;border-radius:18px;word-wrap:break-word;font-size:13px}
        .msg-left{align-self:flex-start;background:#111;border:1px solid #FFD700;color:#FFD700;border-radius:18px 18px 18px 4px}
        .msg-right{align-self:flex-end;background:#FFD700;color:#000;border-radius:18px 18px 4px 18px}
        #oracle-ballot{display:none;border:1px solid #FFD700;padding:10px;margin-bottom:10px;background:rgba(255,215,0,0.1);text-align:center;border-radius:12px}
        #sync-panel,#rate-panel{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.95);border:2px solid #FFD700;z-index:5000;padding:30px;text-align:center;border-radius:24px}
        #nav-hud{display:none;position:fixed;bottom:0;left:0;width:100%;background:rgba(0,10,0,0.95);border-top:2px solid #FFD700;z-index:4000;padding:20px;text-align:center}
        .hud-btn,.sync-btn,.rate-btn{background:transparent;border:1px solid #FFD700;color:#FFD700;padding:12px;margin:10px 5px;cursor:pointer;border-radius:30px}
        #profile-panel{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,10,0,0.97);border:2px solid #FFD700;z-index:6000;padding:20px;width:85%;max-width:320px;border-radius:24px}
        #profile-panel input{width:100%;padding:8px;background:#000;border:1px solid #FFD700;color:#FFD700;border-radius:12px}
        #intent-panel{display:none;position:fixed;bottom:110px;left:5%;width:90%;background:rgba(0,10,0,0.97);border:2px solid #FFD700;z-index:5000;padding:0;border-radius:20px;max-height:60vh;overflow-y:auto}
        .accordion-section{border-bottom:1px solid #FFD700}
        .accordion-header{width:100%;background:transparent;border:none;color:#FFD700;padding:12px 15px;text-align:left;font-size:14px;cursor:pointer;display:flex;justify-content:space-between}
        .accordion-body{display:none;padding:0 15px 12px}
        .intent-btn{background:transparent;border:1px solid #FFD700;border-radius:30px;padding:8px 12px;margin:4px;cursor:pointer}
        .intent-btn.selected{background:#FFD700;color:#000}
        .vibe-option{border-radius:30px}
        .inbox-item{display:flex;align-items:center;margin-bottom:8px;padding:8px;border:1px solid #FFD700;border-radius:16px}
        .inbox-actions button{margin-left:5px;background:transparent;border:1px solid #FFD700;color:#FFD700;cursor:pointer;padding:5px 10px;border-radius:20px}
        #profile-card{display:none;position:fixed;bottom:0;left:0;width:100%;background:rgba(0,10,0,0.97);border-top:2px solid #FFD700;z-index:4500;padding:20px;border-radius:20px 20px 0 0;max-height:55vh;overflow-y:auto}
        .safety-buttons{display:flex;gap:10px;margin-top:10px;justify-content:center}
        .safety-btn{border-radius:20px;padding:6px 12px;background:transparent;border:1px solid #FFD700;color:#FFD700;cursor:pointer}
        .safety-btn.danger{border-color:#f00;color:#f00}
        .send-btn{display:block;width:100%;background:#FFD700;color:#000;border:none;padding:12px;margin-top:15px;border-radius:30px;font-weight:bold;cursor:pointer}
        .close-card{background:transparent;border:1px solid #f00;color:#f00;padding:10px;border-radius:30px;width:100%;margin-top:8px;cursor:pointer}
        #receipt-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:9999;justify-content:center;align-items:center;color:#FFD700}
        .receipt-card{border:2px solid #FFD700;padding:25px;max-width:320px;background:#000;border-radius:24px}
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="status-bar"></div>
    <div id="mode-toggle">
        <button id="mode-browse" class="mode-btn active">BROWSE</button>
        <button id="mode-create" class="mode-btn">CREATE</button>
    </div>
    <div id="heatmap-loading" class="heatmap-loading">Loading...</div>
    <button id="profile-gear" style="display:none;">⚙️</button>
    <button id="heatmap-toggle-btn">🔥</button>
    <button id="emergency-btn">🆘</button>
    <button id="fab" style="display:none;">+</button>

    <div id="profile-panel">
        <h3>YOUR PROFILE</h3>
        <label>Display Name</label><input type="text" id="prof-name">
        <label>Avatar Emoji</label><input type="text" id="prof-emoji" maxlength="2">
        <label>Age</label><input type="number" id="prof-age">
        <label>Nationality</label><input type="text" id="prof-nationality">
        <label>Profession</label><input type="text" id="prof-profession">
        <label>Vibe Tags (comma separated)</label><input type="text" id="prof-tags">
        <button class="profile-save-btn" onclick="saveProfile()">SAVE</button>
        <button class="profile-close-btn" onclick="closeProfilePanel()">CLOSE</button>
    </div>
    <div id="intent-panel"></div>
    <div id="terminal">
        <div class="terminal-header">
            <span>💬 CHAT</span>
            <button class="three-dots" id="chat-menu-btn">⋮</button>
        </div>
        <div id="inbox-panel"></div>
        <div id="oracle-ballot">STATUS: PENDING</div>
        <button id="oracle-btn" onclick="initiateOracle()" style="display:none;">[ SYNC GPS WITH ORACLE ]</button>
        <div id="msg-box"></div>
        <div style="display:flex">
            <input type="text" id="chat-in" placeholder="TYPE..." style="flex:1;background:#000;border:1px solid #FFD700;color:#FFD700;padding:10px;border-radius:30px 0 0 30px">
            <button onclick="sendMsg()" style="background:#FFD700;color:#000;border:none;padding:10px;border-radius:0 30px 30px 0">SEND</button>
        </div>
    </div>
    <div id="profile-card">
        <div class="emoji" id="card-emoji"></div>
        <div class="name" id="card-name"></div>
        <div class="stats" id="card-stats"></div>
        <div class="row"><span>Age</span><span id="card-age"></span></div>
        <div class="row"><span>Nationality</span><span id="card-nationality"></span></div>
        <div class="row"><span>Profession</span><span id="card-profession"></span></div>
        <div class="tags" id="card-tags"></div>
        <div class="vibe-section" id="card-vibe" style="display:none"></div>
        <div class="safety-buttons" id="card-safety-buttons"></div>
        <button class="send-btn" id="card-send-btn">[ SEND REQUEST ]</button>
        <button class="close-card" onclick="closeProfileCard()">CLOSE</button>
    </div>

    <div id="sync-panel">
        <h2>VENUE LOCKED</h2><p id="sync-venue"></p><p id="sync-status">Waiting for both users to confirm...</p>
        <button class="sync-btn" id="sync-confirm-btn" onclick="confirmProceed()">[ CONFIRM & PROCEED ]</button>
    </div>
    <div id="rate-panel">
        <h2>MEET COMPLETE</h2><p>How was your experience?</p>
        <button class="rate-btn" onclick="submitRating(1)">👍</button>
        <button class="rate-btn" onclick="submitRating(-1)">👎</button>
    </div>
    <div id="nav-hud">
        <h3 id="target-name">MATCHED</h3><p id="meet-timer"></p>
        <button class="hud-btn" id="terminate-btn">TERMINATE</button>
    </div>
    <div id="receipt-overlay">
        <div class="receipt-card">
            <div style="font-size:18px;">SESSION //REDACTED</div>
            <div class="redacted-bar">█████ PURGED █████</div>
            <div>VERIFY: <span id="receipt-hash"></span></div>
            <div id="receipt-ttl"></div>
        </div>
    </div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        // ========== INIT ==========
        const _supabase = supabase.createClient("https://rnroyhkvkmzuichysxnk.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJucm95aGt2a216dWljaHlzeG5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5MjIzMDAsImV4cCI6MjA5MjQ5ODMwMH0.O1poxwOr2kESKiqRTgkb86AFFwIN8wEMuW10UEsp_DU");
        const MAPBOX_TOKEN = 'pk.eyJ1IjoiYmFkYXJraGFuMTE1IiwiYSI6ImNtb2dybG02cDB6bXAyd3M2dDZoeGR3ZzAifQ.-Bepjo9kyGavV3lO3LOWug';
        mapboxgl.accessToken = MAPBOX_TOKEN;

        const MAX_VENUE_DISTANCE_KM = 20, NODE_EXPIRY_MINUTES = 30, HEATMAP_RADIUS_KM = 50, HEATMAP_CELL_SIZE_DEG = 0.02, MIN_NODES_FOR_HEATMAP = 3;
        const MEET_DURATION_MINUTES = new URLSearchParams(window.location.search).get('debug') ? parseInt(new URLSearchParams(window.location.search).get('debug')) : 2;

        const categories = {
            social: { label:'🍻 Social', presets:['☕ Coffee & Conversation','🍽️ Foodie Meetup','🌙 Night Out','📸 Social Collab'] },
            games: { label:'⚽ Games', presets:['⚽ Football','🏏 Cricket','🎾 Tennis'] },
            work: { label:'🔧 Work', presets:['🔨 I Can Help','☕ Co‑Working / Study'] },
            parents: { label:'🧒 Parents', presets:['🧸 Kids’ Playdate','🤱 Mum2Mum','👨 Dad’s Crew','👨‍👩‍👧 Family Hangout'] }
        };
        const vibeChecks = {
            '☕ Coffee & Conversation': {q:'What kind of coffee vibe?', a:'Loud & social', b:'Quiet & intimate'},
            '🍽️ Foodie Meetup': {q:'What cuisine mood?', a:'Adventurous / new', b:'Comfort / familiar'},
            '🌙 Night Out': {q:'Tonight feels like…', a:'Dancing & energy', b:'Deep talk over drinks'},
            '📸 Social Collab': {q:'What type of content?', a:'Video / Reels', b:'Photography'}
        };

        let myUserId = localStorage.getItem('vessel_user_id');
        if (!myUserId) { myUserId = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); localStorage.setItem('vessel_user_id', myUserId); }
        let currentMode = 'browse', currentN = null, myLoc = {lat:0,lng:0}, gpsReady = false, gpsFailures = 0;
        let meetRated = false, myConfirmed = false, meetTimerInterval = null, oracleProcessed = false, acceptancePoll = null, lastMsgId = 0;
        let selectedCategory = 'social', selectedIntent = '☕ Coffee & Conversation', customIntentText = '', selectedNodeType = 'one_on_one', selectedMaxParticipants = null, selectedVibeAnswer = null;
        let pendingNodeProps = null, seekerVibeAnswer = null, selectedVenueCoords = null;

        const map = new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/dark-v11',center:[55.39,25.34],zoom:12});

        function setStatus(t,m){const b=document.getElementById('status-bar');const c={info:'#FFD700',warning:'#f90',error:'#f00',success:'#FFD700'};b.style.display='block';b.style.borderColor=c[t];b.style.color=c[t];b.innerText=m;setTimeout(()=>{if(b.innerText===m)b.style.display='none'},3000);}
        function clearStatus(){document.getElementById('status-bar').style.display='none';}
        function haversine(lat1,lng1,lat2,lng2){const R=6371;const dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
        async function ensureUser(){const{data}=await _supabase.from('users').select('id').eq('id',myUserId).limit(1);if(!data||data.length===0)await _supabase.from('users').insert([{id:myUserId,trust_score:5.0,total_meets:0}]);}
        ensureUser();

        navigator.geolocation.watchPosition(p=>{myLoc={lat:p.coords.latitude,lng:p.coords.longitude};gpsReady=true;gpsFailures=0;clearStatus();},e=>{gpsFailures++;gpsReady=false;if(gpsFailures===1)setStatus('warning','GPS signal weak');if(gpsFailures>5)setStatus('error','GPS unavailable');},{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
        setStatus('info','Waiting for GPS...');

        // ========== SAFETY ==========
        async function reportUser(reportedId, nodeId) {
            let reason = prompt('Reason for report (optional):');
            await _supabase.from('reports').insert({reporter_id:myUserId, reported_id:reportedId, node_id:nodeId||null, reason:reason||'No reason'});
            setStatus('success','Report sent');
        }
        async function blockUser(blockedId) {
            await _supabase.from('blocks').insert({blocker_id:myUserId, blocked_id:blockedId});
            setStatus('success','User blocked');
            closeProfileCard();
        }
        async function unblockUser(blockedId){ await _supabase.from('blocks').delete().eq('blocker_id',myUserId).eq('blocked_id',blockedId); setStatus('success','Unblocked'); }
        async function isBlocked(userId){ const{data}=await _supabase.from('blocks').select('id').eq('blocker_id',myUserId).eq('blocked_id',userId).maybeSingle(); return !!data; }
        function shareEmergencyLocation(){ if(!gpsReady){ setStatus('error','GPS not ready'); return; } const url=`https://maps.google.com/?q=${myLoc.lat},${myLoc.lng}`; if(navigator.share) navigator.share({title:'Emergency Location', text:`I need help. My live location: ${url}`}); else alert(`Share this link: ${url}`); }
        document.getElementById('emergency-btn').addEventListener('click', shareEmergencyLocation);

        // ========== PROFILE (creator) ==========
        window.openProfilePanel = async () => {
            document.getElementById('profile-panel').style.display='block';
            const{data}=await _supabase.from('users').select('display_name,avatar_emoji,age,nationality,profession,vibe_tags').eq('id',myUserId).single();
            if(data){
                document.getElementById('prof-name').value=data.display_name||'';
                document.getElementById('prof-emoji').value=data.avatar_emoji||'🤖';
                document.getElementById('prof-age').value=data.age||'';
                document.getElementById('prof-nationality').value=data.nationality||'';
                document.getElementById('prof-profession').value=data.profession||'';
                document.getElementById('prof-tags').value=(data.vibe_tags||[]).join(', ');
            }
        };
        function closeProfilePanel(){document.getElementById('profile-panel').style.display='none';}
        window.saveProfile = async () => {
            const displayName=document.getElementById('prof-name').value.trim();
            const avatarEmoji=document.getElementById('prof-emoji').value.trim()||'🤖';
            const age=parseInt(document.getElementById('prof-age').value)||null;
            const nationality=document.getElementById('prof-nationality').value.trim();
            const profession=document.getElementById('prof-profession').value.trim();
            const tagsRaw=document.getElementById('prof-tags').value;
            const vibeTags=tagsRaw?tagsRaw.split(',').map(t=>t.trim()).filter(t=>t.length>0):[];
            await _supabase.from('users').upsert({id:myUserId, display_name:displayName, avatar_emoji:avatarEmoji, age:age, nationality:nationality||null, profession:profession||null, vibe_tags:vibeTags, trust_score:5.0, total_meets:0},{onConflict:'id'});
            setStatus('success','Profile updated');
            closeProfilePanel();
        };
        document.getElementById('profile-gear').onclick = openProfilePanel;

        // ========== ACCORDION (FULLY WORKING) ==========
        function buildAccordion(){
            const panel = document.getElementById('intent-panel');
            panel.innerHTML = '';
            for(const cat in categories){
                const section = document.createElement('div'); section.className = 'accordion-section';
                const header = document.createElement('button'); header.className = 'accordion-header';
                header.innerHTML = `<span>${categories[cat].label}</span><span>▼</span>`;
                header.onclick = () => toggleAccordion(cat);
                const body = document.createElement('div'); body.className = 'accordion-body'; body.id = 'body-'+cat;
                const btnRow = document.createElement('div'); btnRow.className = 'btn-row';
                categories[cat].presets.forEach(intent => {
                    const btn = document.createElement('button'); btn.className = 'intent-btn'; btn.innerText = intent;
                    btn.onclick = (e) => { e.stopPropagation(); selectIntent(cat, intent, false); document.getElementById('done-btn-'+cat).style.display = 'inline-block'; };
                    btnRow.appendChild(btn);
                });
                const customBtn = document.createElement('button'); customBtn.className = 'intent-btn custom'; customBtn.innerText = '+ Custom';
                customBtn.onclick = (e) => { e.stopPropagation(); selectIntent(cat, null, true); document.getElementById('custom-'+cat).style.display = 'block'; document.getElementById('done-btn-'+cat).style.display = 'inline-block'; };
                btnRow.appendChild(customBtn);
                body.appendChild(btnRow);

                const typeRow = document.createElement('div'); typeRow.className = 'node-type-row';
                typeRow.innerHTML = '<span>Type:</span>';
                ['one_on_one','group'].forEach(type => {
                    const typeBtn = document.createElement('button'); typeBtn.className = 'intent-btn';
                    typeBtn.innerText = type==='one_on_one'?'🔒 1‑on‑1':'👥 Group';
                    typeBtn.onclick = (e) => { e.stopPropagation(); selectedNodeType = type;
                        document.querySelectorAll('#body-'+cat+' .node-type-row .intent-btn').forEach(b=>b.classList.remove('selected'));
                        typeBtn.classList.add('selected');
                        if(type==='group'){ document.getElementById('max-part-'+cat).style.display='inline-block'; const vr=document.getElementById('vibe-row-'+cat); if(vr) vr.style.display='none'; }
                        else{ document.getElementById('max-part-'+cat).style.display='none'; if(cat==='social' && selectedIntent!=='Custom' && vibeChecks[selectedIntent]){ const vr=document.getElementById('vibe-row-'+cat); if(vr) vr.style.display='block'; } }
                    };
                    typeRow.appendChild(typeBtn);
                });
                const maxInput = document.createElement('input'); maxInput.type='number'; maxInput.min=2; maxInput.max=20; maxInput.placeholder='Max (opt)';
                maxInput.className='custom-input'; maxInput.id='max-part-'+cat; maxInput.style.display='none';
                maxInput.onchange = () => selectedMaxParticipants = maxInput.value ? parseInt(maxInput.value) : null;
                typeRow.appendChild(maxInput);
                body.appendChild(typeRow);

                if(cat === 'social'){
                    const vibeRow = document.createElement('div'); vibeRow.className='vibe-row'; vibeRow.id='vibe-row-'+cat; vibeRow.style.display='none';
                    body.appendChild(vibeRow);
                }
                const customInput = document.createElement('input'); customInput.className='custom-input'; customInput.id='custom-'+cat;
                customInput.placeholder = 'Describe your '+categories[cat].label.split(' ')[1]+' intent...';
                customInput.oninput = (e) => { customIntentText = e.target.value; };
                const doneBtn = document.createElement('button'); doneBtn.className='done-btn'; doneBtn.id='done-btn-'+cat; doneBtn.innerText='DONE';
                doneBtn.onclick = () => { closeIntentPanel(); startCreation(); };
                body.appendChild(customInput); body.appendChild(doneBtn);
                section.appendChild(header); section.appendChild(body);
                panel.appendChild(section);
            }
            const closeBtn = document.createElement('button'); closeBtn.className='close-btn'; closeBtn.innerText='CLOSE';
            closeBtn.onclick = closeIntentPanel;
            panel.appendChild(closeBtn);
        }
