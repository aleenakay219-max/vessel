<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VESSEL | ADMIN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet">
    <style>
        body,html{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:monospace}
        #login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#FFD700}
        #login-screen input{padding:10px;background:#000;border:1px solid #FFD700;color:#FFD700;margin:10px 0;width:200px;text-align:center}
        #login-screen button{background:#FFD700;color:#000;border:none;padding:10px 30px;cursor:pointer;font-weight:bold;margin:5px}
        #dashboard{display:none;flex-direction:column;height:100%}
        #top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid #FFD700;color:#FFD700}
        #top-bar button{background:transparent;border:1px solid #FFD700;color:#FFD700;padding:6px 15px;cursor:pointer}
        #tabs{display:flex;flex-wrap:wrap;gap:8px;padding:8px 20px;border-bottom:1px solid #333;max-height:100px;overflow-y:auto}
        .tab-btn{background:transparent;border:1px solid #FFD700;color:#FFD700;padding:6px 12px;cursor:pointer;font-size:11px}
        .tab-btn.active{background:#FFD700;color:#000}
        #content{flex:1;overflow-y:auto;padding:20px;color:#FFD700}
        .stats-row{display:flex;flex-wrap:wrap;gap:15px;margin-bottom:20px}
        .stat-card{background:#111;border:1px solid #FFD700;padding:15px;flex:1;min-width:140px;text-align:center}
        .stat-card h3{font-size:26px;margin:0}
        .stat-card p{font-size:11px;color:#aaa;margin-top:4px}
        table{width:100%;border-collapse:collapse;margin-top:12px;font-size:11px}
        th,td{padding:7px 9px;text-align:left;border-bottom:1px solid #333}
        th{color:#FFD700;font-size:10px;text-transform:uppercase}
        tr:hover{background:rgba(255,215,0,0.05);cursor:pointer}
        .action-btn{background:transparent;border:1px solid #FFD700;color:#FFD700;padding:3px 9px;cursor:pointer;font-size:10px;margin-right:3px}
        .action-btn.danger{border-color:#f00;color:#f00}
        .search-input{width:100%;padding:7px;background:#000;border:1px solid #FFD700;color:#FFD700;margin-bottom:12px;font-size:11px}
        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:999;align-items:center;justify-content:center}
        .modal-box{background:#000;border:2px solid #FFD700;padding:20px;max-width:500px;width:90%;color:#FFD700;text-align:left;max-height:80vh;overflow-y:auto}
        .modal-box button{margin:5px;background:transparent;border:1px solid #FFD700;color:#FFD700;padding:7px 18px;cursor:pointer}
        .form-group{margin-bottom:10px}
        .form-group label{display:block;font-size:11px;margin-bottom:3px}
        .form-group input,.form-group textarea{width:100%;padding:7px;background:#000;border:1px solid #FFD700;color:#FFD700;font-family:monospace;font-size:11px}
        .toast{position:fixed;top:20px;right:20px;background:#333;border:1px solid #FFD700;color:#FFD700;padding:10px 20px;z-index:1000;display:none}
        .chart-container{margin-bottom:25px}
        .chart-container h3{margin-bottom:12px;font-size:15px}
        .bar-row{display:flex;align-items:center;margin-bottom:7px}
        .bar-label{width:90px;font-size:10px;text-align:right;padding-right:8px}
        .bar-track{flex:1;background:#222;height:18px;position:relative}
        .bar-fill{height:100%;background:#FFD700;position:absolute;left:0;top:0}
        .bar-value{width:50px;font-size:10px;padding-left:8px}
        .heatmap-row{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:16px;margin-bottom:4px;background:#111}
        .heatmap-dot{width:16px;height:16px;border-radius:50%;display:inline-block}
        #mini-map{height:200px;margin-bottom:10px;border:1px solid #FFD700}
    </style>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div id="login-screen">
        <h2>VESSEL ADMIN</h2>
        <input type="password" id="pw" placeholder="Password">
        <button onclick="login()">LOGIN</button>
        <button onclick="testConnection()" style="background:transparent;border:1px dashed #FFD700;color:#FFD700;">TEST CONNECTION</button>
        <p id="login-error" style="color:#f00;display:none;"></p>
    </div>

    <div id="dashboard">
        <div id="top-bar">
            <h2>VESSEL ADMIN</h2>
            <button onclick="logout()">LOGOUT</button>
        </div>
        <div id="tabs">
            <button class="tab-btn active" onclick="switchTab('stats')">STATS</button>
            <button class="tab-btn" onclick="switchTab('users')">USERS</button>
            <button class="tab-btn" onclick="switchTab('nodes')">NODES</button>
            <button class="tab-btn" onclick="switchTab('intents')">INTENTS</button>
            <button class="tab-btn" onclick="switchTab('tags')">TAGS</button>
            <button class="tab-btn" onclick="switchTab('requests')">REQUESTS</button>
            <button class="tab-btn" onclick="switchTab('oracle')">ORACLE SESSIONS</button>
            <button class="tab-btn" onclick="switchTab('ratings')">RATINGS</button>
            <button class="tab-btn" onclick="switchTab('receipts')">RECEIPTS</button>
            <button class="tab-btn" onclick="switchTab('rejected')">REJECTED</button>
            <button class="tab-btn" onclick="switchTab('banners')">BANNERS</button>
            <button class="tab-btn" onclick="switchTab('activity')">ACTIVITY AREAS</button>
            <button class="tab-btn" onclick="switchTab('analytics')">ANALYTICS</button>
            <button class="tab-btn" onclick="switchTab('logs')">LOGS</button>
            <button class="tab-btn" onclick="switchTab('settings')">SETTINGS</button>
        </div>
        <div id="content"></div>
    </div>

    <div id="modal" class="modal-overlay"><div class="modal-box" id="modal-content"></div></div>
    <div id="toast" class="toast"></div>

    <script>
        if (typeof window.supabase === 'undefined') {
            document.body.innerHTML = '<h2 style="color:red;text-align:center;margin-top:50px;">Supabase library failed to load. Hard refresh (Ctrl+Shift+R).</h2>';
            throw new Error('Supabase not loaded');
        }

        const SUPABASE_URL = 'https://rnroyhkvkmzuichysxnk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJucm95aGt2a216dWljaHlzeG5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5MjIzMDAsImV4cCI6MjA5MjQ5ODMwMH0.O1poxwOr2kESKiqRTgkb86AFFwIN8wEMuW10UEsp_DU';
        const MAPBOX_TOKEN = 'pk.eyJ1IjoiYmFkYXJraGFuMTE1IiwiYSI6ImNtb2dybG02cDB6bXAyd3M2dDZoeGR3ZzAifQ.-Bepjo9kyGavV3lO3LOWug';
        mapboxgl.accessToken = MAPBOX_TOKEN;

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let isLoggedIn = false;
        let currentTab = 'stats';

        if(localStorage.getItem('admin_logged_in') === 'true') {
            document.getElementById('login-screen').style.display='none';
            document.getElementById('dashboard').style.display='flex';
            isLoggedIn = true;
            loadTab('stats');
        }

        function showLoginError(msg) { document.getElementById('login-error').style.display='block'; document.getElementById('login-error').innerText=msg; }
        async function testConnection() {
            try { const {data,error} = await supabase.from('admin_config').select('*').limit(1);
                if(error) alert('Connection failed: '+error.message); else alert('Connection OK. Rows: '+data.length);
            } catch(e) { alert('Error: '+e.message); }
        }

        async function login() {
            const pw = document.getElementById('pw').value;
            if(!pw) { showLoginError('Enter password'); return; }
            try {
                const encoder = new TextEncoder();
                const hashBuffer = await crypto.subtle.digest('SHA-256', encoder.encode(pw));
                const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b=>b.toString(16).padStart(2,'0')).join('');
                const {data:configRow,error} = await supabase.from('admin_config').select('value').eq('key','admin_password').single();
                if(error||!configRow) { alert('DB error'); return; }
                if(hashHex === configRow.value) {
                    localStorage.setItem('admin_logged_in','true');
                    document.getElementById('login-screen').style.display='none';
                    document.getElementById('dashboard').style.display='flex';
                    isLoggedIn = true; loadTab('stats');
                } else { showLoginError('Invalid password.'); }
            } catch(e) { alert('Login error: '+e.message); }
        }

        function logout() {
            localStorage.removeItem('admin_logged_in');
            isLoggedIn = false;
            document.getElementById('dashboard').style.display='none';
            document.getElementById('login-screen').style.display='flex';
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
            event.target.classList.add('active');
            loadTab(tab);
        }

        async function loadTab(tab) {
            const content = document.getElementById('content');
            switch(tab) {
                case 'stats': content.innerHTML = await getStatsHTML(); break;
                case 'users': content.innerHTML = await getUsersHTML(); break;
                case 'nodes': content.innerHTML = await getNodesHTML(); break;
                case 'intents': content.innerHTML = await getIntentsHTML(); break;
                case 'tags': content.innerHTML = await getTagsHTML(); break;
                case 'requests': content.innerHTML = await getRequestsHTML(); break;
                case 'oracle': content.innerHTML = await getOracleHTML(); break;
                case 'ratings': content.innerHTML = await getRatingsHTML(); break;
                case 'receipts': content.innerHTML = await getReceiptsHTML(); break;
                case 'rejected': content.innerHTML = await getRejectedHTML(); break;
                case 'banners': content.innerHTML = await getBannersHTML(); break;
                case 'activity': content.innerHTML = await getActivityAreasHTML(); break;
                case 'analytics': content.innerHTML = await getAnalyticsHTML(); break;
                case 'logs': content.innerHTML = await getLogsHTML(); break;
                case 'settings': content.innerHTML = await getSettingsHTML(); break;
            }
        }

        // ========== STATS ==========
        async function getStatsHTML() {
            const now = new Date().toISOString(); const today = new Date(); today.setHours(0,0,0,0); const todayISO = today.toISOString();
            const [u,n,m,nt] = await Promise.all([
                supabase.from('users').select('*',{count:'exact',head:true}),
                supabase.from('nodes').select('*',{count:'exact',head:true}).eq('status','active').gt('expires_at',now),
                supabase.from('oracle_sessions').select('*',{count:'exact',head:true}).gte('created_at',todayISO).eq('meet_completed',true),
                supabase.from('nodes').select('*',{count:'exact',head:true}).gte('created_at',todayISO)
            ]);
            return `<div class="stats-row"><div class="stat-card"><h3>${u.count||0}</h3><p>Users</p></div><div class="stat-card"><h3>${n.count||0}</h3><p>Active Nodes</p></div><div class="stat-card"><h3>${m.count||0}</h3><p>Meets Today</p></div><div class="stat-card"><h3>${nt.count||0}</h3><p>Nodes Today</p></div></div>`;
        }

        // ========== USERS ==========
        async function getUsersHTML() {
            const {data:users}=await supabase.from('users').select('*').order('created_at',{ascending:false});
            if(!users) return '<p>Error</p>';
            let html='<input class="search-input" id="userSearch" placeholder="Search..." oninput="filterUsers()"><table id="userTable"><thead><tr><th>Avatar</th><th>Name</th><th>Trust</th><th>Meets</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
            users.forEach(u=>{
                html+=`<tr data-name="${u.display_name||''}" data-id="${u.id}" data-status="${u.status||'active'}" onclick="showUserDetail('${u.id}')"><td>${u.avatar_emoji||'🤖'}</td><td>${u.display_name||'?'}</td><td>⭐${(u.trust_score||5).toFixed(1)}</td><td>${u.total_meets||0}</td><td style="color:${(u.status||'active')==='active'?'#0f0':'#f00'}">${u.status||'active'}</td><td onclick="event.stopPropagation()">${(u.status||'active')==='active'?`<button class="action-btn" onclick="suspendUser('${u.id}')">Suspend</button><button class="action-btn danger" onclick="banUser('${u.id}')">Ban</button>`:`<button class="action-btn" onclick="reactivateUser('${u.id}')">Reactivate</button>`}</td></tr>`;
            });
            html+='</tbody></table>'; return html;
        }
        function filterUsers(){const q=document.getElementById('userSearch').value.toLowerCase();document.querySelectorAll('#userTable tbody tr').forEach(r=>{r.style.display=(r.dataset.name.includes(q)||r.dataset.id.includes(q)||r.dataset.status.includes(q))?'':'none';});}
        async function suspendUser(id){showModal('Suspend?',async()=>{await supabase.from('users').update({status:'suspended'}).eq('id',id);toast('Suspended');loadTab('users');closeModal();});}
        async function banUser(id){showModal('Ban?',async()=>{await supabase.from('users').update({status:'banned'}).eq('id',id);toast('Banned');loadTab('users');closeModal();});}
        async function reactivateUser(id){showModal('Reactivate?',async()=>{await supabase.from('users').update({status:'active'}).eq('id',id);toast('Reactivated');loadTab('users');closeModal();});}
        async function showUserDetail(id){const{data:u}=await supabase.from('users').select('*').eq('id',id).single();if(!u)return;document.getElementById('modal-content').innerHTML=`<h3>${u.avatar_emoji||'🤖'} ${u.display_name||'?'}</h3><p>ID: ${u.id}</p><p>Age: ${u.age||'N/A'}</p><p>Nationality: ${u.nationality||'N/A'}</p><p>Profession: ${u.profession||'N/A'}</p><p>Trust: ⭐${(u.trust_score||5).toFixed(1)}</p><p>Meets: ${u.total_meets||0}</p><p>Status: ${u.status||'active'}</p><p>Tags: ${(u.vibe_tags||[]).join(', ')||'None'}</p><button onclick="closeModal()">Close</button>`;document.getElementById('modal').style.display='flex';}

        // ========== NODES ==========
        async function getNodesHTML(){const{data:nodes}=await supabase.from('nodes').select('*').order('created_at',{ascending:false}).limit(200);if(!nodes)return'<p>Error</p>';let html='<table><thead><tr><th>Intent</th><th>Category</th><th>Type</th><th>Status</th><th>Creator</th><th>Expires</th><th>Actions</th></tr></thead><tbody>';nodes.forEach(n=>{html+=`<tr onclick="showNodeDetail(${n.id})"><td>${n.intent||'N/A'}</td><td>${n.category||'social'}</td><td>${n.node_type||'one_on_one'}</td><td style="color:${n.status==='active'?'#0f0':'#f00'}">${n.status||'active'}</td><td>${n.user_id}</td><td>${n.expires_at?new Date(n.expires_at).toLocaleString():'N/A'}</td><td onclick="event.stopPropagation()">${n.status==='active'?`<button class="action-btn danger" onclick="expireNode(${n.id})">Expire</button>`:''}</td></tr>`;});html+='</tbody></table>';return html;}
        async function showNodeDetail(id){const{data:n}=await supabase.from('nodes').select('*').eq('id',id).single();if(!n)return;document.getElementById('modal-content').innerHTML=`<h3>Node Detail</h3><p>ID: ${n.id}</p><p>Intent: ${n.intent}</p><p>Category: ${n.category}</p><p>Type: ${n.node_type}</p><p>Status: ${n.status}</p><p>Creator: ${n.user_id}</p><p>Vibe: ${n.vibe_question||'N/A'} → ${n.vibe_answer||'N/A'}</p><p>Location: ${parseFloat(n.lat).toFixed(4)},${parseFloat(n.lng).toFixed(4)}</p><p>Created: ${new Date(n.created_at).toLocaleString()}</p><button onclick="closeModal()">Close</button>${n.status!=='expired'?`<button onclick="expireNode(${n.id});closeModal();">Expire</button>`:''}<button style="border-color:#f00;color:#f00" onclick="deleteNode(${n.id})">Delete</button>`;document.getElementById('modal').style.display='flex';}
        async function expireNode(id){await supabase.from('nodes').update({status:'expired'}).eq('id',id);toast('Expired');loadTab('nodes');}
        async function deleteNode(id){showModal('Delete permanently?',async()=>{await supabase.from('nodes').delete().eq('id',id);toast('Deleted');loadTab('nodes');closeModal();});}

        // ========== INTENTS (fixed: shows all unique intents with node count) ==========
        async function getIntentsHTML(){
            const {data:nodes}=await supabase.from('nodes').select('intent');
            if(!nodes||nodes.length===0) return '<p>No nodes yet.</p>';
            const intentCount = {};
            nodes.forEach(n=>{ const i = n.intent || 'Unknown'; intentCount[i] = (intentCount[i]||0)+1; });
            const intents = Object.entries(intentCount).sort((a,b)=>b[1]-a[1]);
            let html='<p>All intents (including custom) with node counts:</p><table><thead><tr><th>Intent</th><th>Node Count</th><th>Action</th></tr></thead><tbody>';
            intents.forEach(([intent, count])=>{
                html+=`<tr><td>${intent}</td><td>${count}</td><td><button class="action-btn danger" onclick="deleteIntent('${intent.replace(/'/g, "\\'")}')">Delete all nodes with this intent</button></td></tr>`;
            });
            html+='</tbody></table>';
            return html;
        }
        async function deleteIntent(intent){
            showModal(`Delete all nodes with intent "${intent}"? This cannot be undone.`, async()=>{
                const {error} = await supabase.from('nodes').delete().eq('intent', intent);
                if(error) toast('Error: '+error.message, true);
                else { toast(`Deleted ${intent} nodes`); loadTab('intents'); }
                closeModal();
            });
        }

        // ========== TAGS (unchanged, works) ==========
        async function getTagsHTML(){const{data:users}=await supabase.from('users').select('*').not('vibe_tags','is',null).order('created_at',{ascending:false});if(!users||users.length===0)return'<p>No vibe tags.</p>';let html='<table><thead><tr><th>User</th><th>Tags</th><th>Actions</th></tr></thead><tbody>';users.forEach(u=>{html+=`<tr><td>${u.display_name||'?'} (${u.id})</td><td>${(u.vibe_tags||[]).map(t=>`<span style="margin:2px"><button class="action-btn danger" onclick="removeTag('${u.id}','${t.replace(/'/g,"\\'")}')">${t} ✕</button></span>`).join('')}</td><td><button class="action-btn danger" onclick="clearAllTags('${u.id}')">Clear All</button></td></tr>`;});html+='</tbody></table>';return html;}
        async function removeTag(uid,tag){const{data:u}=await supabase.from('users').select('vibe_tags').eq('id',uid).single();if(!u)return;const nt=(u.vibe_tags||[]).filter(t=>t!==tag);await supabase.from('users').update({vibe_tags:nt}).eq('id',uid);toast('Removed');loadTab('tags');}
        async function clearAllTags(uid){showModal('Clear all tags?',async()=>{await supabase.from('users').update({vibe_tags:[]}).eq('id',uid);toast('Cleared');loadTab('tags');closeModal();});}

        // ========== REQUESTS (unchanged) ==========
        async function getRequestsHTML(){const{data}=await supabase.from('requests').select('*').order('created_at',{ascending:false}).limit(200);if(!data||data.length===0)return'<p>No requests found.</p>';let html='<tr><thead><tr><th>ID</th><th>Node</th><th>Requester</th><th>Status</th><th>Answer</th><th>Time</th></tr></thead><tbody>';data.forEach(r=>{html+=`<tr><td>${r.id}</td><td>${r.node_id}</td><td>${r.requester_id}</td><td style="color:${r.status==='accepted'?'#0f0':r.status==='declined'?'#f00':'#FFD700'}">${r.status}</td><td>${r.answer_given||''}</td><td>${new Date(r.created_at).toLocaleString()}</td></tr>`;});html+='</tbody></table>';return html;}

        // ========== ORACLE SESSIONS ==========
        async function getOracleHTML(){const{data}=await supabase.from('oracle_sessions').select('*').order('created_at',{ascending:false}).limit(200);if(!data||data.length===0)return'<p>No oracle sessions.</p>';let html='<table><thead><tr><th>Bridge</th><th>Status</th><th>Venue</th><th>u1 GPS</th><th>u2 GPS</th><th>Meet</th><th>Rating</th><th>Time</th></tr></thead><tbody>';data.forEach(s=>{html+=`<tr><td>${s.bridge_id}</td><td>${s.status}</td><td>${s.selected_venue_name||'N/A'}</td><td>(${parseFloat(s.u1_lat).toFixed(3)},${parseFloat(s.u1_lng).toFixed(3)})</td><td>(${parseFloat(s.u2_lat).toFixed(3)},${parseFloat(s.u2_lng).toFixed(3)})</td><td>${s.meet_completed?'✅':'❌'}</td><td>u1:${s.u1_rating||'-'} u2:${s.u2_rating||'-'}</td><td>${new Date(s.created_at).toLocaleString()}</td></tr>`;});html+='</tbody></table>';return html;}

        // ========== RATINGS ==========
        async function getRatingsHTML(){const{data}=await supabase.from('oracle_sessions').select('*').or('u1_rating.not.is.null,u2_rating.not.is.null').order('created_at',{ascending:false}).limit(200);if(!data||data.length===0)return'<p>No ratings yet.</p>';let html='<tr><thead><tr><th>Bridge</th><th>u1 Rating</th><th>u2 Rating</th><th>Time</th></tr></thead><tbody>';data.forEach(s=>{html+=`<tr><td>${s.bridge_id}</td><td>${s.u1_rating||'-'}</td><td>${s.u2_rating||'-'}</td><td>${new Date(s.created_at).toLocaleString()}</td></tr>`;});html+='</tbody></table>';return html;}

        // ========== RECEIPTS ==========
        async function getReceiptsHTML(){const{data}=await supabase.from('deletion_receipts').select('*').order('created_at',{ascending:false}).limit(200);if(!data||data.length===0)return'<p>No receipts yet.</p>';let html='<table><thead><tr><th>Bridge</th><th>Hash</th><th>Created</th></tr></thead><tbody>';data.forEach(r=>{html+=`<tr><td>${r.bridge_id}</td><td style="font-size:10px">${r.hash}</td><td>${new Date(r.created_at).toLocaleString()}</td></tr>`;});html+='</tbody></table>';return html;}

        // ========== REJECTED REQUESTS ==========
        async function getRejectedHTML(){const{data}=await supabase.from('rejected_requests').select('*').order('created_at',{ascending:false}).limit(200);if(!data||data.length===0)return'<p>No rejected requests.</p>';let html='<table><thead><tr><th>Node</th><th>Requester</th><th>Time</th></tr></thead><tbody>';data.forEach(r=>{html+=`<tr><td>${r.node_id}</td><td>${r.requester_id}</td><td>${new Date(r.created_at).toLocaleString()}</td></tr>`;});html+='</tbody></table>';return html;}

        // ========== BANNERS (full CRUD with mini map) ==========
        let bannerMap = null;
        async function getBannersHTML(){
            const {data:banners}=await supabase.from('banners').select('*').order('created_at',{ascending:false});
            let html='<button class="action-btn" onclick="showBannerForm()">+ Add Banner</button>';
            if(!banners||banners.length===0) html+='<p>No banners.</p>';
            else{
                html+='<table><thead><tr><th>Title</th><th>Msg</th><th>Location</th><th>Active</th><th>Impr</th><th>Actions</th></tr></thead><tbody>';
                banners.forEach(b=>{
                    html+=`<tr><td>${b.title}</td><td>${b.message}</td><td>(${parseFloat(b.lat).toFixed(3)},${parseFloat(b.lng).toFixed(3)})</td><td style="color:${b.is_active?'#0f0':'#f00'}">${b.is_active?'ON':'OFF'}</td><td>${b.impression_count||0}</td><td><button class="action-btn" onclick="showBannerForm('${b.id}')">Edit</button><button class="action-btn" onclick="toggleBanner('${b.id}',${b.is_active})">Toggle</button><button class="action-btn danger" onclick="deleteBanner('${b.id}')">Del</button></td></tr>`;
                });
                html+='</tbody></table>';
            }
            return html;
        }
        function showBannerForm(id=null){
            document.getElementById('modal').style.display='flex';
            const modalDiv = document.getElementById('modal-content');
            modalDiv.innerHTML = `
                <h3>${id?'Edit Banner':'Add Banner'}</h3>
                <div class="form-group"><label>Title</label><input id="banner-title" placeholder="Title"></div>
                <div class="form-group"><label>Message</label><textarea id="banner-message" rows="2" placeholder="Message"></textarea></div>
                <div class="form-group"><label>Location (tap map)</label><div id="mini-map" style="height:200px"></div></div>
                <div class="form-group"><label>Lat</label><input id="banner-lat" readonly></div>
                <div class="form-group"><label>Lng</label><input id="banner-lng" readonly></div>
                <div class="form-group"><label>Active</label><input type="checkbox" id="banner-active" checked></div>
                <button onclick="saveBanner('${id||''}')">Save</button>
                <button onclick="closeModal()">Cancel</button>
            `;
            if(bannerMap) bannerMap.remove();
            bannerMap = new mapboxgl.Map({
                container: 'mini-map',
                style: 'mapbox://styles/mapbox/dark-v11',
                center: [55.39, 25.34],
                zoom: 12
            });
            bannerMap.on('click', (e) => {
                document.getElementById('banner-lat').value = e.lngLat.lat;
                document.getElementById('banner-lng').value = e.lngLat.lng;
                new mapboxgl.Marker().setLngLat(e.lngLat).addTo(bannerMap);
            });
            if(id){
                (async()=>{
                    const {data:b}=await supabase.from('banners').select('*').eq('id',id).single();
                    if(b){
                        document.getElementById('banner-title').value = b.title||'';
                        document.getElementById('banner-message').value = b.message||'';
                        document.getElementById('banner-lat').value = b.lat||'';
                        document.getElementById('banner-lng').value = b.lng||'';
                        document.getElementById('banner-active').checked = b.is_active||false;
                        if(b.lat && b.lng){
                            bannerMap.setCenter([b.lng, b.lat]);
                            new mapboxgl.Marker().setLngLat([b.lng, b.lat]).addTo(bannerMap);
                        }
                    }
                })();
            }
        }
        async function saveBanner(id){
            const title = document.getElementById('banner-title').value;
            const message = document.getElementById('banner-message').value;
            const lat = parseFloat(document.getElementById('banner-lat').value);
            const lng = parseFloat(document.getElementById('banner-lng').value);
            const is_active = document.getElementById('banner-active').checked;
            if(!title || !message || isNaN(lat) || isNaN(lng)){ toast('Please fill all fields and tap map'); return; }
            if(id){
                await supabase.from('banners').update({title, message, lat, lng, is_active}).eq('id',id);
                toast('Banner updated');
            } else {
                await supabase.from('banners').insert([{title, message, lat, lng, is_active, impression_count:0}]);
                toast('Banner added');
            }
            closeModal();
            loadTab('banners');
        }
        async function toggleBanner(id,st){ await supabase.from('banners').update({is_active:!st}).eq('id',id); loadTab('banners'); }
        async function deleteBanner(id){ showModal('Delete?',async()=>{ await supabase.from('banners').delete().eq('id',id); toast('Deleted'); loadTab('banners'); closeModal(); }); }

        // ========== ACTIVITY AREAS (dynamic grid) ==========
        async function getActivityAreasHTML(){
            const {data:nodes, error} = await supabase
                .from('nodes')
                .select('lat, lng')
                .eq('status', 'active')
                .gt('expires_at', new Date().toISOString());
            if(error || !nodes || nodes.length===0) return '<p>No active nodes found.</p>';
            const cellSize = 0.02;
            const grid = new Map();
            nodes.forEach(node => {
                const cellLat = Math.floor(node.lat / cellSize) * cellSize;
                const cellLng = Math.floor(node.lng / cellSize) * cellSize;
                const key = `${cellLat},${cellLng}`;
                if(!grid.has(key)) grid.set(key, { lat: cellLat + cellSize/2, lng: cellLng + cellSize/2, count: 0 });
                grid.get(key).count++;
            });
            const cells = Array.from(grid.values()).sort((a,b)=>b.count - a.count).slice(0,30);
            if(cells.length===0) return '<p>No grid cells with nodes.</p>';
            let html = '<table><thead><tr><th>Color</th><th>Area (approx)</th><th>Node Count</th><th>Intensity</th></tr></thead><tbody>';
            for(const cell of cells){
                let dotColor, intensityLabel;
                if(cell.count >= 10){ dotColor='#ff5050'; intensityLabel='🔴 High'; }
                else if(cell.count >= 3){ dotColor='#FFD700'; intensityLabel='🟡 Moderate'; }
                else { dotColor='#80ff80'; intensityLabel='🟢 Low'; }
                const areaName = `${cell.lat.toFixed(2)},${cell.lng.toFixed(2)}`;
                html += `<tr><td><div style="background:${dotColor}; width:16px; height:16px; border-radius:50%;"></div></td><td>${areaName}</td><td>${cell.count}</td><td>${intensityLabel}</td></tr>`;
            }
            html += '</tbody></table>';
            return html;
        }

        // ========== ANALYTICS (simplified, working) ==========
        async function getAnalyticsHTML(){
            // Meets per day (last 7 days)
            const sevenDaysAgo = new Date(); sevenDaysAgo.setDate(sevenDaysAgo.getDate()-7);
            const {data:meets} = await supabase
                .from('oracle_sessions')
                .select('created_at')
                .eq('meet_completed', true)
                .gte('created_at', sevenDaysAgo.toISOString());
            const daily = {};
            meets?.forEach(m => {
                const d = new Date(m.created_at).toISOString().slice(0,10);
                daily[d] = (daily[d]||0)+1;
            });
            const days = Object.keys(daily).sort();
            const meetCounts = days.map(d=>daily[d]);
            // User growth (last 7 days)
            const {data:users} = await supabase
                .from('users')
                .select('created_at')
                .gte('created_at', sevenDaysAgo.toISOString());
            const userDaily = {};
            users?.forEach(u => {
                const d = new Date(u.created_at).toISOString().slice(0,10);
                userDaily[d] = (userDaily[d]||0)+1;
            });
            const userDays = Object.keys(userDaily).sort();
            const userCounts = userDays.map(d=>userDaily[d]);
            // Top intents (most popular node intents)
            const {data:nodes} = await supabase.from('nodes').select('intent');
            const intentCount = {};
            nodes?.forEach(n => { const i = n.intent; if(i) intentCount[i] = (intentCount[i]||0)+1; });
            const topIntents = Object.entries(intentCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
            return `
                <div class="chart-container"><h3>Meets per Day (last 7 days)</h3>
                <div style="display:flex; gap:4px; align-items:flex-end; height:150px; margin-top:10px;">${days.map((d,i)=>`<div style="flex:1; background:#FFD700; height:${(meetCounts[i]/Math.max(1,...meetCounts))*100}px; position:relative;"><span style="position:absolute; bottom:-20px; left:0; font-size:8px; transform:rotate(-45deg);">${d.slice(5)}</span><div style="text-align:center; font-size:9px;">${meetCounts[i]}</div></div>`).join('')}</div>
                </div>
                <div class="chart-container"><h3>New Users per Day (last 7 days)</h3>
                <div style="display:flex; gap:4px; align-items:flex-end; height:150px; margin-top:10px;">${userDays.map((d,i)=>`<div style="flex:1; background:#FFD700; height:${(userCounts[i]/Math.max(1,...userCounts))*100}px; position:relative;"><span style="position:absolute; bottom:-20px; left:0; font-size:8px; transform:rotate(-45deg);">${d.slice(5)}</span><div style="text-align:center; font-size:9px;">${userCounts[i]}</div></div>`).join('')}</div>
                </div>
                <div class="chart-container"><h3>Top 5 Intent Types (by node count)</h3>
                <div>${topIntents.map(([intent,count])=>`<div class="bar-row"><div class="bar-label">${intent}</div><div class="bar-track"><div class="bar-fill" style="width:${(count/topIntents[0][1])*100}%"></div></div><div class="bar-value">${count}</div></div>`).join('')}</div>
                </div>
            `;
        }

        // ========== LOGS ==========
        async function getLogsHTML(){const{data}=await supabase.from('logs').select('*').order('created_at',{ascending:false}).limit(200);if(!data||data.length===0)return'<p>No logs yet.</p>';let html='</table><thead><tr><th>Time</th><th>Event</th><th>User</th><th>Details</th></tr></thead><tbody>';data.forEach(l=>{html+=`<tr><td>${new Date(l.created_at).toLocaleString()}</td><td>${l.event_type}</td><td>${l.user_id||''}</td><td>${l.details?JSON.stringify(l.details).slice(0,80):''}</td></tr>`;});html+='</tbody></table>';return html;}

        // ========== SETTINGS (read/write from settings table) ==========
        async function getSettingsHTML(){
            const {data:settings} = await supabase.from('settings').select('*');
            const settingsMap = {};
            settings?.forEach(s=>{ settingsMap[s.key]=s.value; });
            return `
                <div class="form-group"><label>Meet Duration (minutes)</label><input id="set_meet_duration" value="${settingsMap.meet_duration_minutes||'25'}"></div>
                <div class="form-group"><label>Node Expiry (minutes)</label><input id="set_node_expiry" value="${settingsMap.node_expiry_minutes||'30'}"></div>
                <div class="form-group"><label>Heatmap Radius (km)</label><input id="set_heatmap_radius" value="${settingsMap.heatmap_radius_km||'50'}"></div>
                <div class="form-group"><label>Min Nodes for Heatmap</label><input id="set_heatmap_min" value="${settingsMap.heatmap_min_nodes||'3'}"></div>
                <div class="form-group"><label>Grid Cell Size (degrees)</label><input id="set_cell_size" value="${settingsMap.heatmap_cell_size_deg||'0.02'}"></div>
                <button class="action-btn" onclick="saveSettings()">Save Settings</button>
            `;
        }
        async function saveSettings(){
            const updates = [
                {key:'meet_duration_minutes', value:document.getElementById('set_meet_duration').value},
                {key:'node_expiry_minutes', value:document.getElementById('set_node_expiry').value},
                {key:'heatmap_radius_km', value:document.getElementById('set_heatmap_radius').value},
                {key:'heatmap_min_nodes', value:document.getElementById('set_heatmap_min').value},
                {key:'heatmap_cell_size_deg', value:document.getElementById('set_cell_size').value}
            ];
            for(const u of updates){
                await supabase.from('settings').upsert({key:u.key, value:u.value, updated_at:new Date().toISOString()});
            }
            toast('Settings saved');
            loadTab('settings');
        }

        // Generic modal & toast
        function showModal(m,onConfirm){document.getElementById('modal').style.display='flex';document.getElementById('modal-content').innerHTML=`<p>${m}</p><button onclick="closeModal()">Cancel</button><button id="modal-confirm" style="border-color:#f00;color:#f00">Confirm</button>`;document.getElementById('modal-confirm').addEventListener('click',onConfirm);}
        function closeModal(){document.getElementById('modal').style.display='none';}
        function toast(msg,isErr){const t=document.getElementById('toast');t.innerText=msg;t.style.display='block';t.style.borderColor=isErr?'#f00':'#FFD700';setTimeout(()=>t.style.display='none',3000);}
    </script>
