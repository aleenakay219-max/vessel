            }
        };
        function closeProfilePanel() { document.getElementById('profile-panel').style.display = 'none'; }
        window.saveProfile = async () => {
            const displayName = document.getElementById('prof-name').value.trim();
            const avatarEmoji = document.getElementById('prof-emoji').value.trim() || '🤖';
            const age = parseInt(document.getElementById('prof-age').value) || null;
            const nationality = document.getElementById('prof-nationality').value.trim();
            const profession = document.getElementById('prof-profession').value.trim();
            const tagsRaw = document.getElementById('prof-tags').value;
            const vibeTags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(t => t.length > 0) : [];

            const { error } = await _supabase.from('users').upsert({
                id: myUserId, display_name: displayName, avatar_emoji: avatarEmoji, age: age,
                nationality: nationality || null, profession: profession || null, vibe_tags: vibeTags,
                trust_score: 5.0, total_meets: 0
            }, { onConflict: 'id' });
            if (error) { alert('Failed to save profile: ' + error.message); }
            else { closeProfilePanel(); setStatus('success', 'Profile updated!'); setTimeout(() => clearStatus(), 2000); }
        };

        // ========== NEW BOTTOM SHEET (replaces old accordion) ==========
        let currentCategory = 'social';
        function buildBottomSheet() {
            const categoryRow = document.getElementById('category-row');
            categoryRow.innerHTML = '';
            INTENT_CATEGORIES.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn' + (currentCategory === cat.id ? ' active' : '');
                btn.innerText = cat.label;
                btn.onclick = () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = cat.id;
                    renderIntentsForCategory(cat.id);
                };
                categoryRow.appendChild(btn);
            });
            renderIntentsForCategory(currentCategory);
        }
        function renderIntentsForCategory(catId) {
            const grid = document.getElementById('intents-grid');
            grid.innerHTML = '';
            const catData = INTENT_CATEGORIES.find(c => c.id === catId);
            if (!catData) return;
            catData.intents.forEach(intent => {
                const item = document.createElement('div');
                item.className = 'intent-item';
                item.innerText = intent;
                item.onclick = () => {
                    selectIntent(catId, intent, false);
                    closeIntentPanel();
                    startCreation();
                };
                grid.appendChild(item);
            });
            // Custom intent button
            const customItem = document.createElement('div');
            customItem.className = 'intent-item';
            customItem.innerText = '+ Custom';
            customItem.onclick = () => {
                const customText = prompt('Enter your custom intent:');
                if (customText && customText.trim()) {
                    selectIntent(catId, customText, true);
                    closeIntentPanel();
                    startCreation();
                }
            };
            grid.appendChild(customItem);
        }
        window.openIntentPanel = () => {
            if (!gpsReady) { setStatus('warning', 'GPS not ready'); return; }
            document.getElementById('intent-panel').style.display = 'flex';
        };
        function closeIntentPanel() {
            document.getElementById('intent-panel').style.display = 'none';
        }
        document.getElementById('intent-cancel').addEventListener('click', closeIntentPanel);
        // Build the bottom sheet (replaces old buildAccordion call)
        buildBottomSheet();

        // NOTE: The original selectIntent, startCreation, loadInbox, handleRequest, sendMsg, startChatSync,
